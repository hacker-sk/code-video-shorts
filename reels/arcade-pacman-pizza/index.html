<!doctype html><html><head><meta charset='utf-8'><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body><canvas id='c' width='1080' height='1920'></canvas><script>
const TXT=[
"Pac-Man was inspired by PIZZA.",
"His creator was at lunch,",
"looking at a pizza,",
"with one slice missing.",
"That gap became his mouth.",
"Follow for more facts."];
let cs=.5;const C=TXT.map((tx,i)=>{const n=tx.split(' ').length,d=(window.__TIMING&&window.__TIMING[i])||.4+.3*n;const o={tx,n,d,s:cs,e:cs+d};cs+=d;return o});
const W=135,H=240,cv=document.getElementById('c'),gl=cv.getContext('webgl2',{preserveDrawingBuffer:true});
const B=document.createElement('canvas');B.width=1080;B.height=1920;const G=B.getContext('2d');
const sm=document.createElement('canvas');sm.width=W;sm.height=H;const g=sm.getContext('2d');
const P={bg:'#050514',mz:'#2121de',ye:'#ffee00',cr:'#e08a2e',ch:'#ffd45e',pp:'#d62839',gr:'#ff3030',gc:'#30d0ff',wh:'#ffffff',pk:'#ffb8de',dt:'#ffb8ae',tb:'#6b3a1f',bl:'#3a3aff'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
const disc=(cx,cy,r,c)=>{g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y)+.5);g.fillRect(Math.round(cx)-w,Math.round(cy)+y,2*w+1,1)}};
const ell=(cx,cy,rx,ry,c)=>{g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(1-y*y/(ry*ry))+.5);g.fillRect(cx-w,cy+y,2*w+1,1)}};
function pie(cx,cy,r,mh,c,inv,dx){dx=dx||1;g.fillStyle=c;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y>r*r)continue;const m=Math.abs(Math.atan2(y,x*dx))<mh;if(inv?m:!m)g.fillRect(Math.round(cx)+x,Math.round(cy)+y,1,1)}}
function ghost(x,y,c,f){x=Math.round(x);disc(x,y,6,c);px(x-6,y,13,7,c);for(let i=0;i<4;i++)if((i+Math.floor(f*6))%2==0)px(x-6+i*4,y+7,3,2,P.bg);px(x-4,y-2,3,3,P.wh);px(x+2,y-2,3,3,P.wh);px(x-3,y-1,2,2,P.mz);px(x+3,y-1,2,2,P.mz)}
function pizza(mh){pie(67,104,44,mh,P.cr);pie(67,104,39,mh,P.ch);[[-14,-12],[12,-18],[0,6],[-20,16],[18,14],[-4,-28]].forEach(a=>{const an=Math.atan2(a[1],a[0]);if(Math.abs(an)>mh)disc(67+a[0],104+a[1],5,P.pp)})}
function maze(f,pacX,dir){px(6,76,123,2,P.mz);px(6,126,123,2,P.mz);for(let x=14;x<=122;x+=8){const left=dir>0?x>pacX+4:x<pacX-4;if(left)px(x,100,2,2,P.dt)}if(Math.floor(f*4)%2){px(8,98,6,6,P.dt);px(121,98,6,6,P.dt)}}
function scene(idx,f,lt,ch){
px(0,0,W,H,P.bg);
const open=.15+.55*Math.abs(Math.sin(f*7)),k=cl(lt/ch.d);
if(idx==0){const x=14+108*k;maze(f,x,1);pie(x,101,9,open,P.ye,false,1);ghost(x-30,101,P.gr,f);ghost(x-52,101,P.gc,f)}
else if(idx==1){px(0,150,W,90,P.tb);px(18,100,24,50,P.mz);disc(30,90,11,P.dt);px(26,88,2,3,P.bg);px(33,88,2,3,P.bg);ell(92,148,30,6,P.wh);ell(92,144,20,5,P.ch);px(86,142,3,2,P.pp);px(95,144,3,2,P.pp);for(let i=0;i<3;i++)px(88+i*6+Math.round(Math.sin(f*3+i)*2),132-((f*14+i*7)%14),2,2,P.wh)}
else if(idx==2){pizza(0)}
else if(idx==3){const m=.75*ease(cl(lt/.9));pizza(m);if(m>0){const o=ease(cl(lt/.9));pie(67+Math.round(34*o),104+Math.round(10*o),44,m,P.cr,true);pie(67+Math.round(34*o),104+Math.round(10*o),39,m,P.ch,true)}}
else if(idx==4){if(lt<.45)pizza(.75);else{pie(67,104,44,open,P.ye);px(70,80,5,5,P.bg)}}
else{const x=121-107*k;maze(f,x,-1);pie(x,101,9,open,P.ye,false,-1);ghost(x-28,101,Math.floor(f*5)%2&&k>.7?P.wh:P.bl,f)}
}
function cap(ch,lt,last){
G.font='bold 78px DejaVu Sans Mono,Courier New,monospace';G.textAlign='left';
const sp=G.measureText(' ').width,L=[];let cur=[],w=0;
ch.tx.split(' ').forEach(t=>{const ww=G.measureText(t).width;if(cur.length&&w+sp+ww>960){L.push({cur,w});cur=[];w=0}w+=(cur.length?sp:0)+ww;cur.push({t,ww})});L.push({cur,w});
const a=Math.min(1,lt/.12)*(last?1:Math.min(1,(ch.d-lt)/.12)),lh=98,y0=1560-L.length*lh/2+78;
G.globalAlpha=a;G.lineWidth=16;G.lineJoin='round';G.strokeStyle='#050514';
L.forEach((ln,i)=>{let x=540-ln.w/2;ln.cur.forEach(o=>{const y=y0+i*lh+(1-a)*20;G.strokeText(o.t,x,y);G.fillStyle=/^[A-Z]{3,}[.,!?]?$/.test(o.t)?P.ye:'#fff';G.fillText(o.t,x,y);x+=o.ww+sp})});G.globalAlpha=1}
const NL=String.fromCharCode(10);
const VS=['#version 300 es','in vec2 p;','out vec2 v;','void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}'].join(NL);
const FS=['#version 300 es','precision highp float;','in vec2 v;','uniform sampler2D u;','uniform float t;','out vec4 o;','void main(){','vec2 q=v*2.-1.;','q*=1.+dot(q,q)*vec2(.045,.03);','vec2 uv=q*.5+.5;','if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){o=vec4(0.,0.,0.,1.);return;}','vec3 c=texture(u,uv).rgb;','vec3 b=vec3(0.);','for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++)b+=texture(u,uv+vec2(float(i),float(j))*5./vec2(1080.,1920.)).rgb;','c+=b/9.*.45;','float sl=.8+.2*cos(uv.y*240.*6.2831853);','float m=mod(floor(gl_FragCoord.x),3.);','vec3 mk=vec3(m<.5?1.:.72,(m>.5&&m<1.5)?1.:.72,m>1.5?1.:.72);','c*=sl*mk*1.18;','float vg=1.-smoothstep(.55,1.15,length(q));','c*=.35+.65*vg;','c*=.97+.03*sin(t*60.);','o=vec4(c,1.);}'].join(NL);
function mk(ty,src){const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lc);gl.vertexAttribPointer(lc,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
const ut=gl.getUniformLocation(pr,'t');
function present(t){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,B);gl.uniform1f(ut,t);gl.viewport(0,0,1080,1920);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
window.render=t=>{
const f=Math.floor(t*10)/10;let idx=C.length-1;for(let i=0;i<C.length;i++)if(t<C[i].e){idx=i;break}
const ch=C[idx],lt=Math.max(0,t-ch.s);
scene(idx,f,lt,ch);G.imageSmoothingEnabled=false;G.drawImage(sm,0,0,1080,1920);
G.font='bold 44px DejaVu Sans Mono,monospace';G.textAlign='left';G.fillStyle='#ff3030';G.fillText('1UP',70,120);G.textAlign='center';G.fillStyle='#fff';G.fillText('HIGH SCORE',540,120);G.fillStyle=P.ye;G.fillText(String(Math.floor(t*130)*10),540,175);
cap(ch,lt,idx==C.length-1);
G.fillStyle='rgba(0,0,0,'+(1-Math.min(1,t/.4))+')';G.fillRect(0,0,1080,1920);
present(t)};
window.__ready=true;
</script></body></html>
