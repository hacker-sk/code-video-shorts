<!doctype html>
<html><head><meta charset="utf-8"><title>Where's Abhimanyu</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000;height:100%}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Hand-drawn style, 1080x1920, deterministic window.render(t). Nominal timeline = 77s (scenes + captions are authored on it).
// Voice-driven: TXT = caption lines (tts.mjs speaks them); window.__TIMING (seconds per line, from timing.json) warps the nominal timeline to the voice.
const W=1080,H=1920,DUR=77,c=document.getElementById('c'),x=c.getContext('2d');
const PI=Math.PI,cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),R=s=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'};
let LT=0,BOIL=0,INK='#2a1913';
const circ=(cx,cy,r,a0=0,a1=2*PI,n=24)=>Array.from({length:n+1},(_,i)=>{const a=a0+(a1-a0)*i/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]});
const ell=(cx,cy,rx,ry,n=20)=>circ(0,0,1,0,2*PI,n).map(p=>[cx+p[0]*rx,cy+p[1]*ry]);
const rect=(a,b,w,h)=>[[a,b],[a+w,b],[a+w,b+h],[a,b+h],[a,b]];
function dens(pts){const o=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/35));for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
function stroke(pts,p,seed,w=6){if(p<=0)return;const d=dens(pts),n=d.length-1,m=Math.min(n,p*n),f=Math.floor(m),o=d.slice(0,f+1);
 if(m<n&&m>f){const a=d[f],b=d[f+1],q=m-f;o.push([a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q])}
 x.strokeStyle=INK;x.lineCap=x.lineJoin='round';
 for(let ps=0;ps<2;ps++){x.beginPath();o.forEach((q,i)=>{const s=seed+ps*91+i*3.7+BOIL*13.3,px=q[0]+(R(s)-.5)*2.4,py=q[1]+(R(s+1.7)-.5)*2.4;if(i)x.lineTo(px,py);else x.moveTo(px,py)});x.lineWidth=ps?w*.5:w;x.stroke()}}
const E=(polys,s,d,seed,w)=>polys.forEach((pl,i)=>stroke(pl,cl((LT-s)/d),seed+i*7,w));
function fig(px,py,s,t,o={}){const sw=o.walk?Math.sin(t*(o.run?11:6))*(o.run?30:18)*s:0,hx=px+(o.turn||0)*s,L=[];
 L.push(circ(hx,py-150*s+(o.low||0)*s,22*s,0,2*PI,16));
 L.push([[px,py-128*s],[px,py-62*s]]);
 L.push(o.arms?[[px-55*s,py-150*s],[px,py-112*s],[px+55*s,py-150*s]]:[[px-28*s+sw*.4,py-76*s],[px,py-112*s],[px+28*s-sw*.4,py-76*s]]);
 L.push(o.sit?[[px+50*s,py-18*s],[px,py-62*s],[px-10*s,py-18*s]]:[[px-sw,py],[px,py-62*s],[px+sw,py]]);
 if(o.bow){const bx=px+30*s,by=py-100*s,r=55*s;L.push(circ(bx,by,r,-1.2,1.2,12));L.push([[bx+Math.cos(-1.2)*r,by+Math.sin(-1.2)*r],[bx+Math.cos(1.2)*r,by+Math.sin(1.2)*r]])}
 return L}
const tent=px=>[[[px-120,1150],[px,960],[px+120,1150],[px-120,1150]],[[px-30,1150],[px,1060],[px+30,1150]],[[px,960],[px,880]],[[px,880],[px+40,900],[px+46,950]]];

const S1=()=>{const g=1050;E([[[40,g],[1040,g]],[[40,1290],[1040,1290]]],0,1.5,1,6);
 const sun=circ(540,g,190,PI,2*PI,30);
 if(LT>.5){x.save();x.globalAlpha*=cl((LT-.5)/2)*.9;x.fillStyle='#f9e6b4';x.beginPath();sun.forEach((p,i)=>{if(i)x.lineTo(p[0],p[1]);else x.moveTo(p[0],p[1])});x.fill();x.restore()}
 E([sun,circ(540,g,130,PI,2*PI,24),circ(540,g,75,PI,2*PI,20)],.5,2.5,5,5);
 const sp=[];for(let i=0;i<11;i++){const px=80+i*90,tl=(R(i)-.5)*30,top=g-70-R(i+9)*30;sp.push([[px,g],[px+tl,top]]);sp.push([[px+tl,top],[px+tl+26,top+12],[px+tl,top+24]])}
 E(sp,1.5,3,20,4);E(fig(150+LT*48,1290,1.7,LT,{walk:1,bow:1}),1,1,40,6)};
const S2=()=>{E([[[40,1150],[1040,1150]]],0,1,1,6);[190,540,890].forEach((p,i)=>E(tent(p),.3+i*.5,1.8,10+i*30,6));
 [360,540,720].forEach((p,i)=>E(fig(p,1330,1.3,LT,{sit:1,turn:-34+i*10,low:14}),3+i*.6,1.2,70+i*9,5));
 E(fig(80+LT*16,1520,1.7,LT,{walk:1,bow:1}),.5,1,90,6)};
const S3=()=>{const g=1300;E([[[40,g],[1040,g]]],0,1,1,6);E(tent(190).map(l=>l.map(p=>[p[0],p[1]+150])),.3,2,5,6);
 for(let i=0;i<13;i++)E([[[340+i*30,g-12],[340+i*30+16,g-12]]],1+i*.22,.2,30+i,5);
 E(fig(800,g,2,LT,{turn:-14}),.4,1.2,70,6);
 if(LT>4){x.save();x.globalAlpha*=cl((LT-4)/1)*(.75+.25*Math.sin(LT*3));x.fillStyle=INK;x.font='600 380px Caveat,"Segoe Script",cursive';x.textAlign='center';x.fillText('?',540,760);x.restore()}};
const S4=()=>{const pts=[];for(let i=0;i<=220;i++){const a=i*.22,r=8+i*1.75;pts.push([540+Math.cos(a)*r,860+Math.sin(a)*r])}
 E([pts],0,6,3,6);E(fig(540,905,.55,LT,{}),6,1,40,5);E(fig(540,1500,1.3,LT,{turn:-6,low:10}),8,1.5,60,6)};
const S5=()=>{const cx=540,cy=880;for(let k=0;k<4;k++){const r=70+((LT*55+k*95)%380),a=cl(1-LT/5.5)*(1-r/460);if(a>0){x.save();x.globalAlpha*=a;stroke(circ(cx,cy,r,0,2*PI,40),1,k*11,5);x.restore()}}
 E([circ(cx,cy,14,0,2*PI,10)],0,.5,70,6);E([[[60,cy],[1020,cy]]],5,1.8,80,5)};
const S6=()=>{E([rect(450,220,180,330),circ(540,515,13,0,2*PI,10),[[480,260],[600,260]]],0,2.5,1,6);
 E([rect(420,690,240,400),circ(625,900,12,0,2*PI,10),[[430,1100],[650,1100]]],4,3,9,6);
 E([[[460,1480],[460,1260],[520,1260]],[[460,1480],[660,1480]],[[480,1480],[480,1590]],[[640,1480],[640,1590]]],8,3,17,6)};
const S7=()=>{const g=1150;E([[[40,g],[1040,g]]],0,1,1,6);const bx=120+cl(LT/6)*600,fa=1-cl((LT-4.6)/1.6);
 for(let i=0;i<10;i++){const px=120+i*60;if(px<bx-20)stroke(circ(px,g+30,6,0,2*PI,8),1,30+i,4)}
 if(fa>0){x.save();x.globalAlpha*=fa;E(fig(bx,g,1.1,LT,{walk:1,run:1}),0,.3,50,5);x.restore()}
 E(fig(860,g,1.7,LT,{arms:1}),.5,1.5,60,6)};
const S8=()=>{const gl=x.createRadialGradient(540,900,40,540,900,700);gl.addColorStop(0,'rgba(255,190,100,.38)');gl.addColorStop(1,'rgba(255,190,100,0)');x.fillStyle=gl;x.fillRect(0,200,W,1400);
 E([[[430,430],[430,560],[460,620],[600,620],[630,560],[630,430],[430,430]],circ(650,500,45,-1.5,1.5,12),[[400,640],[660,640]]],0,2.5,1,6);
 E([0,1,2].map(i=>{const p=[];for(let k=0;k<=10;k++)p.push([500+i*45+Math.sin(k*.6+LT*2+i)*10,410-k*13]);return p}),1,2,20,5);
 E([[[180,1230],[900,1230]],[[240,1230],[240,1400]],[[840,1230],[840,1400]],ell(340,1220,60,10),ell(540,1220,60,10),ell(740,1220,60,10)],3,2.5,30,6);
 [340,540,740].forEach((p,i)=>E([circ(p,1085,38,0,2*PI,18),[[p-70,1150],[p-60,1160],[p-30,1135],[p+30,1135],[p+60,1160],[p+70,1150]]],4+i*.5,1.2,60+i*9,5))};
const SC=[[0,9,S1],[9,19,S2],[19,29,S3],[29,41,S4],[41,48,S5],[48,60,S6],[60,70,S7],[70,77,S8]];
const CAP=[[0,5,"The worst moment of Arjun’s life wasn’t a battle."],[5,9,"It was walking back into his own camp."],
[9,14,"He’s fought all day. He returns at sunset, tired, and something’s wrong."],[14,19,"No music. No conch shells. His brothers won’t look at him."],
[19,25,"And Arjun says the one thing that breaks you, because it’s so small:"],[25,29,"“Where’s Abhimanyu? He always runs out to meet me.”"],
[29,35,"His son had died that day. Sixteen years old. Alone, surrounded in the Chakravyu."],[35,41,"He didn’t find out because someone told him. He found out from the absence of someone running towards him."],
[41,48,"I think that’s how grief actually arrives. Never the big announcement. It’s the quiet where a sound used to be."],[48,54,"The phone that doesn’t ring. The person not at the door. The chair that is now empty."],
[54,60,"You don’t notice the love while it’s happening, because it’s so ordinary."],[60,64,"You notice when it stops."],
[64,70,"Abhimanyu running out every evening was the most normal thing in Arjun’s life, until it was the only thing he wanted back."],
[70,73.5,"So the next time you’re sipping coffee, or having an ordinary dinner with your parents, be grateful for it."],[73.5,77,"These are the moments you will cherish for the rest of your lives."]];

// voice-over lines (tts.mjs reads TXT from the page)
const TXT=CAP.map(a=>a[2]);
// real start time of each line: LEAD + running sum of the voice durations (fallback: the nominal caption lengths)
const LEAD=.5,TIM=Array.isArray(window.__TIMING)&&window.__TIMING.length===CAP.length?window.__TIMING:CAP.map(a=>a[1]-a[0]);
const RS=[LEAD];TIM.forEach(d=>RS.push(RS[RS.length-1]+d));
const NS=CAP.map(a=>a[0]).concat(DUR),REAL=RS[RS.length-1];
// real time -> nominal time (piecewise linear per line), so scenes and drawing follow the voice
const nom=r=>{if(r<=RS[0])return 0;if(r>=REAL)return DUR-.001;const i=RS.findIndex((v,k)=>r<RS[k+1]);return NS[i]+(r-RS[i])/(RS[i+1]-RS[i])*(NS[i+1]-NS[i])};
function caption(r){const i=CAP.findIndex((a,k)=>r>=RS[k]&&r<RS[k+1]);if(i<0)return;const k=CAP[i];x.save();x.globalAlpha=cl(Math.min((r-RS[i])/.4,(RS[i+1]-r)/.4));x.fillStyle=INK;
 x.font='600 58px Caveat,"Segoe Script","Comic Sans MS",cursive';x.textAlign='center';let line='',y=1680;
 k[2].split(' ').forEach(w=>{const tt=line?line+' '+w:w;if(x.measureText(tt).width>900){x.fillText(line,540,y);y+=70;line=w}else line=tt});x.fillText(line,540,y);x.restore()}
const GR=Array.from({length:300},(_,i)=>[R(i)*W,R(i+500)*H,R(i+900)*2+.6]);
window.DURATION=REAL;
window.render=function(r){r=cl(r,0,REAL);const t=nom(r);BOIL=Math.floor(r*6);const tk=cl((t-40.4)/1.2);INK=mix('#2a1913','#f3dcb4',tk);
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,mix('#f4cf96','#241a30',tk));g.addColorStop(1,mix('#e59a58','#5a3446',tk));x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle=INK;GR.forEach(p=>{x.globalAlpha=.07;x.fillRect(p[0],p[1],p[2],p[2])});
 SC.forEach(([s,e,f])=>{if(t>=s&&t<e){LT=t-s;x.globalAlpha=cl(Math.min(s?(t-s)/.5:1,e<DUR?(e-t)/.5:1));x.save();f();x.restore()}});
 x.globalAlpha=1;caption(r)};
// ready for tts.mjs / render.mjs once the handwriting font is loaded (or after 8s if it can't load)
Promise.race([document.fonts.load('600 58px Caveat').catch(()=>{}),new Promise(r=>setTimeout(r,8000))]).then(()=>{window.render(0);window.__ready=true});
</script></body></html>
