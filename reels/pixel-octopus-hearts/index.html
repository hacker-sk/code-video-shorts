<!doctype html><html><head><meta charset='utf-8'><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body><canvas id='c' width='1080' height='1920'></canvas><script>
const TXT=[
"Octopuses have THREE hearts.",
"Two pump blood to the gills.",
"One pumps it to the body.",
"When they swim, that one stops.",
"So they'd rather crawl.",
"Follow for more weird facts."];
let cs=.5;const C=TXT.map((tx,i)=>{const n=tx.split(' ').length,d=(window.__TIMING&&window.__TIMING[i])||.4+.3*n;const o={tx,n,d,s:cs,e:cs+d};cs+=d;return o});
const W=108,H=192,Z=10,G=document.getElementById('c').getContext('2d');
const sm=document.createElement('canvas');sm.width=W;sm.height=H;const g=sm.getContext('2d');
const P={bg:'#1b1034',w1:'#2a1a5e',w2:'#3d2b8a',o:'#ff6b8b',od:'#c23b64',ol:'#ffa3b8',wh:'#ffffff',hr:'#ff2d55',gd:'#ffd45e',bk:'#111111',sd:'#e8c27a',sdd:'#a8793a',bu:'#9ad7ff'};
const px=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
const disc=(cx,cy,r,c)=>{g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y)+.5);g.fillRect(Math.round(cx)-w,Math.round(cy)+y,2*w+1,1)}};
const HS=['0110110','1111111','1111111','0111110','0011100','0001000'];
const heart=(x,y,c)=>HS.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]=='1')px(x+i,y+j,1,1,c)});
function oct(cx,cy,f,hc,amp,flat){
for(let k=0;k<8;k++){const bx=cx-15+k*4.3;for(let j=0;j<24;j++){const sw=Math.round(Math.sin(f*9+j*.45+k*.8)*(1+j*.15)*amp);const sp=Math.round((k-3.5)*j*(flat?.35:.18));px(bx+sw+sp,cy+10+(flat?Math.round(j*.35):j),3,1,k%2?P.od:P.o)}}
disc(cx,cy,15,P.o);disc(cx-4,cy-6,7,P.ol);
px(cx-9,cy+5,6,6,P.wh);px(cx+4,cy+5,6,6,P.wh);px(cx-7,cy+7,3,4,P.bk);px(cx+6,cy+7,3,4,P.bk);
const b=Math.floor(f*6)%2,dead=hc[2]==P.w2;
heart(cx-11,cy-9-b,hc[0]);heart(cx+5,cy-9-b,hc[1]);heart(cx-3,cy-3-(dead?0:b),hc[2]);
if(dead){for(let i=0;i<5;i++){px(cx-2+i,cy-2+i,1,1,P.hr);px(cx+2-i,cy-2+i,1,1,P.hr)}}}
function scene(idx,f,lt,ch){
const bands=[P.bg,P.w1,P.w2];
for(let y=0;y<H;y++){const b=Math.min(2,Math.floor(y/64));px(0,y,W,1,bands[b]);if(y%64>=60&&b<2)for(let x=0;x<W;x++)if((x+y)%2==0)px(x,y,1,1,bands[b+1])}
for(let i=0;i<12;i++)px((i*37+11)%W+Math.round(Math.sin(f*2+i)*2),H-((f*16+i*53)%(H+8)),2,2,P.bu);
const hc=[P.hr,P.hr,P.hr];let ox=54,oy=84,amp=1,flat=false;
if(idx==0)hc[Math.min(2,Math.floor(lt/ch.d*3))]=P.gd;
if(idx==1){hc[0]=P.gd;hc[1]=P.gd}
if(idx==2)hc[2]=P.gd;
if(idx==3){hc[2]=P.w2;amp=2;oy=84-Math.round(Math.abs(Math.sin(f*2.5))*34);ox=54+Math.round(Math.sin(f*2)*10)}
if(idx==4){px(0,150,W,42,P.sd);for(let i=0;i<30;i++)px((i*29)%W,152+(i*13)%38,2,1,P.sdd);oy=116;ox=54+Math.round(Math.sin(f*1.5)*14);flat=true}
oct(ox,oy,f,hc,amp,flat);
if(idx==5)for(let i=0;i<3;i++)heart(26+i*28,40-Math.round(Math.sin(f*3+i)*5),P.hr);
}
function cap(ch,lt,last){
G.font='bold 80px DejaVu Sans Mono,Courier New,monospace';G.textBaseline='alphabetic';G.textAlign='left';
const sp=G.measureText(' ').width,L=[];let cur=[],w=0;
ch.tx.split(' ').forEach(t=>{const ww=G.measureText(t).width;if(cur.length&&w+sp+ww>960){L.push({cur,w});cur=[];w=0}w+=(cur.length?sp:0)+ww;cur.push({t,ww})});L.push({cur,w});
const a=Math.min(1,lt/.12)*(last?1:Math.min(1,(ch.d-lt)/.12)),lh=100,y0=1560-L.length*lh/2+80;
G.globalAlpha=a;G.lineWidth=16;G.lineJoin='round';G.strokeStyle='#0a0519';
L.forEach((ln,i)=>{let x=540-ln.w/2;ln.cur.forEach(o=>{const y=y0+i*lh+(1-a)*20;G.strokeText(o.t,x,y);G.fillStyle=/^[A-Z]{3,}[.,!?]?$/.test(o.t)?P.gd:'#fff';G.fillText(o.t,x,y);x+=o.ww+sp})});G.globalAlpha=1}
window.render=t=>{
const f=Math.floor(t*10)/10;let idx=C.length-1;for(let i=0;i<C.length;i++)if(t<C[i].e){idx=i;break}
const ch=C[idx],lt=Math.max(0,t-ch.s);
scene(idx,f,lt,ch);G.imageSmoothingEnabled=false;G.drawImage(sm,0,0,W*Z,H*Z);
G.font='bold 44px DejaVu Sans Mono,monospace';G.textAlign='center';G.fillStyle=P.gd;G.fillText('* WEIRD FACTS *',540,150);
cap(ch,lt,idx==C.length-1);
G.fillStyle='rgba(0,0,0,'+(1-Math.min(1,t/.4))+')';G.fillRect(0,0,1080,1920)};
window.__ready=true;
</script></body></html>
