<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:1080px;height:1920px}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const TXT=[
  "The most powerful technique in Jujutsu Kaisen... is built on real mathematics.",
  "Gojo's Infinity technique comes from an ancient paradox — posed by the Greek philosopher Zeno.",
  "To reach Gojo, you must cross half the distance. Then half of that. Then half again.",
  "Infinitely many steps... yet they all add up to exactly one.",
  "One half plus one quarter plus one eighth... forever — converges to one.",
  "This is a convergent infinite series. Infinite steps, finite result.",
  "Gojo's Infinity uses this idea — anything approaching him is slowed through infinite subdivision.",
  "Blue is Convergence. Space collapses inward. Everything is pulled toward a single point.",
  "Red is Divergence. The reverse. An explosive force that pushes everything away.",
  "In real math, convergence and divergence don't create forces. Gojo's power is fiction inspired by the concept.",
  "But combine them — and something new appears.",
  "An imaginary mass. A phenomenon that shouldn't exist... rushing toward you.",
  "Imaginary numbers are real mathematics. The square root of negative one. Used in quantum physics and engineering.",
  "Gege Akutami even worked with RIKEN — Japan's top science institute — to explain the math behind Limitless.",
  "The Six Eyes let Gojo perceive cursed energy with perfect precision. That's what makes combining Blue and Red possible.",
  "Hollow Purple. The void technique. Born where convergence meets divergence — in the space between real and imaginary."
];

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 1080, H = 1920;

// Pixel size for pixel art look
const PX = 4;

// Timing: each line gets ~3.8s, total ~62s
const TIMING = [4, 3.8, 3.8, 3.8, 3.8, 3.8, 4, 4, 4, 4, 3.5, 3.5, 4, 4, 4, 4];
let cs = 0.5;
const STARTS = [];
TXT.forEach((_, i) => { STARTS[i] = cs; cs += TIMING[i]; });

// Palette
const PAL = {
  bg:       '#050510',
  darkBg:   '#08081a',
  purple:   '#9b30ff',
  purpleDk: '#5500cc',
  purpleLt: '#cc88ff',
  blue:     '#1a88ff',
  blueLt:   '#66aaff',
  red:      '#ff2244',
  redLt:    '#ff6688',
  gold:     '#ffcc00',
  white:    '#f0f0ff',
  gray:     '#8888aa',
  grayDk:   '#333355',
  teal:     '#00ddcc',
  black:    '#000008'
};

// --- Helpers ---
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  const rx = Math.round(x/PX)*PX, ry = Math.round(y/PX)*PX;
  const rw = Math.round(w/PX)*PX||PX, rh = Math.round(h/PX)*PX||PX;
  ctx.fillRect(rx, ry, rw, rh);
}

function ease(t, d) {
  const p = Math.max(0, Math.min(1, t / d));
  return p < 0.5 ? 2*p*p : -1+(4-2*p)*p;
}

function easeIn(t, d) {
  const p = Math.max(0, Math.min(1, t/d));
  return p*p*p;
}

function lerp(a, b, t) { return a + (b-a)*t; }

function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

// Pseudo-random seeded
function mkRng(seed) {
  let s = seed;
  return () => { s = (s*1664525 + 1013904223) & 0xffffffff; return (s>>>0)/4294967296; };
}

// Draw pixelated circle
function pixCircle(cx, cy, r, color, fill) {
  const step = PX;
  for (let dy = -r; dy <= r; dy += step) {
    for (let dx = -r; dx <= r; dx += step) {
      const dist = Math.sqrt(dx*dx+dy*dy);
      if (fill ? dist <= r : (dist >= r-PX*2 && dist <= r)) {
        px(cx+dx, cy+dy, step, step, color);
      }
    }
  }
}

// Draw pixelated line
function pixLine(x1,y1,x2,y2,color,thick=1) {
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx+dy*dy);
  const steps = Math.ceil(len/PX);
  for (let i=0;i<=steps;i++) {
    const t = i/steps;
    px(x1+dx*t-thick/2, y1+dy*t-thick/2, thick*PX, thick*PX, color);
  }
}

// Draw star field
function drawStars(rng, count, alpha) {
  for (let i=0;i<count;i++) {
    const sx = rng()*W, sy = rng()*H;
    const br = rng() > 0.85 ? PAL.white : (rng()>0.5 ? PAL.blueLt : PAL.purpleLt);
    ctx.globalAlpha = alpha * (0.3 + rng()*0.7);
    px(sx, sy, PX, PX, br);
  }
  ctx.globalAlpha = 1;
}

// Gojo face pixel art — white spiky hair, black blindfold, navy uniform
function drawGojo(cx, cy, scale, blindfold, blueEyes) {
  const s = scale;
  // Hair (white spiky)
  const hairSpikes = [
    [-3,-6],[−2,-7],[-1,-7.5],[0,-8],[1,-7.5],[2,-7],[3,-6],
    [-4,-4],[-3,-5],[3,-5],[4,-4],[-5,-2],[5,-2]
  ];
  // Simple block pixel art face
  // Face base
  for (let dy=-4;dy<=3;dy++) {
    for (let dx=-3;dx<=3;dx++) {
      px(cx+dx*8*s, cy+dy*8*s, 8*s, 8*s, '#f5deb3');
    }
  }
  // White hair top
  const hairRng = mkRng(42);
  for (let dy=-9;dy<=-4;dy++) {
    for (let dx=-4;dx<=4;dx++) {
      const dist = Math.abs(dx)+Math.abs(dy+6.5);
      if (dist < 7 + hairRng()*1.5) {
        px(cx+dx*8*s, cy+dy*8*s, 8*s, 8*s, '#e8e8f0');
      }
    }
  }
  // Hair sides
  for (let dy=-6;dy<=-2;dy++) {
    px(cx-4*8*s, cy+dy*8*s, 8*s, 8*s, '#d8d8e8');
    px(cx+4*8*s, cy+dy*8*s, 8*s, 8*s, '#d8d8e8');
    px(cx-5*8*s, cy+dy*8*s, 8*s, 8*s, '#c0c0d0');
    px(cx+5*8*s, cy+dy*8*s, 8*s, 8*s, '#c0c0d0');
  }
  // Spiky hair tips
  [[-5,-10],[-3,-11],[-1,-12],[1,-12],[3,-11],[5,-10],[-6,-8],[6,-8]].forEach(([ddx,ddy])=>{
    px(cx+ddx*8*s, cy+ddy*8*s, 8*s, 8*s, '#d0d0e0');
  });
  // Blindfold or eyes
  if (blindfold) {
    for (let dx=-3;dx<=3;dx++) {
      px(cx+dx*8*s, cy-1*8*s, 8*s, 8*s, '#111122');
      px(cx+dx*8*s, cy+0*8*s, 8*s, 8*s, '#1a1a2e');
    }
  } else {
    // Six Eyes — bright blue
    px(cx-2*8*s, cy-1*8*s, 8*s, 8*s, '#00aaff');
    px(cx+2*8*s, cy-1*8*s, 8*s, 8*s, '#00aaff');
    if (blueEyes) {
      px(cx-2*8*s, cy-1*8*s, 8*s, 8*s, '#44ddff');
      px(cx+2*8*s, cy-1*8*s, 8*s, 8*s, '#44ddff');
      // glow
      ctx.globalAlpha=0.4;
      pixCircle(cx-2*8*s+4*s, cy-1*8*s+4*s, 16*s, '#44ddff', true);
      pixCircle(cx+2*8*s+4*s, cy-1*8*s+4*s, 16*s, '#44ddff', true);
      ctx.globalAlpha=1;
    }
  }
  // Nose
  px(cx, cy+1*8*s, 4*s, 4*s, '#d4a070');
  // Mouth
  for (let dx=-1;dx<=1;dx++) {
    px(cx+dx*8*s, cy+2*8*s, 8*s, 4*s, '#c08060');
  }
  // High collar navy uniform
  for (let dy=4;dy<=10;dy++) {
    for (let dx=-4;dx<=4;dx++) {
      px(cx+dx*8*s, cy+dy*8*s, 8*s, 8*s, '#1a1a3a');
    }
  }
  // Collar highlight
  px(cx-1*8*s, cy+4*8*s, 8*s, 8*s, '#2a2a5a');
  px(cx+1*8*s, cy+4*8*s, 8*s, 8*s, '#2a2a5a');
}

// Particle system
function makeParticles(rng, cx, cy, count, spread, colors) {
  const pts = [];
  for (let i=0;i<count;i++) {
    const angle = rng()*Math.PI*2;
    const spd = 20 + rng()*80;
    pts.push({
      x: cx, y: cy,
      vx: Math.cos(angle)*spd,
      vy: Math.sin(angle)*spd,
      color: colors[Math.floor(rng()*colors.length)],
      life: 0.5+rng()*1.5,
      size: 1+Math.floor(rng()*3)
    });
  }
  return pts;
}

function drawParticles(pts, age) {
  pts.forEach(p => {
    const lt = clamp(age/p.life,0,1);
    if (lt>=1) return;
    const px2 = p.x + p.vx*age, py2 = p.y + p.vy*age;
    ctx.globalAlpha = (1-lt)*(1-lt);
    px(px2, py2, p.size*PX, p.size*PX, p.color);
  });
  ctx.globalAlpha=1;
}

// Draw infinity symbol (∞) in pixel art
function drawInfinity(cx, cy, r, color, progress) {
  const steps = 120;
  const lim = Math.floor(steps*clamp(progress,0,1));
  for (let i=0;i<lim;i++) {
    const theta = (i/steps)*Math.PI*2;
    const denom = 1+Math.sin(theta)*Math.sin(theta);
    const ix = cx + r*Math.cos(theta)/denom;
    const iy = cy + r*Math.sin(theta)*Math.cos(theta)/denom;
    px(ix-PX/2, iy-PX/2, PX*2, PX*2, color);
  }
}

// Draw converging lines (Blue)
function drawConvergence(cx, cy, numLines, t, color) {
  for (let i=0;i<numLines;i++) {
    const angle = (i/numLines)*Math.PI*2;
    const dist = 400 - t*380;
    const x1 = cx + Math.cos(angle)*clamp(dist,20,500);
    const y1 = cy + Math.sin(angle)*clamp(dist,20,500);
    const prog = clamp(t,0,1);
    ctx.globalAlpha = 0.4+prog*0.5;
    pixLine(x1, y1, cx+Math.cos(angle)*20, cy+Math.sin(angle)*20, color, 1);
  }
  ctx.globalAlpha=1;
}

// Draw diverging lines (Red)
function drawDivergence(cx, cy, numLines, t, color) {
  for (let i=0;i<numLines;i++) {
    const angle = (i/numLines)*Math.PI*2;
    const dist = 20 + t*380;
    const x2 = cx + Math.cos(angle)*clamp(dist,20,500);
    const y2 = cy + Math.sin(angle)*clamp(dist,20,500);
    const prog = clamp(t,0,1);
    ctx.globalAlpha = 0.4+prog*0.3;
    pixLine(cx+Math.cos(angle)*20, cy+Math.sin(angle)*20, x2, y2, color, 1);
  }
  ctx.globalAlpha=1;
}

// Number line / axis
function drawAxis(ox, oy, len, color) {
  pixLine(ox-len/2, oy, ox+len/2, oy, color, 1);
  pixLine(ox, oy-len/2, ox, oy+len/2, color, 1);
  // ticks
  for (let i=-4;i<=4;i++) {
    pixLine(ox+i*(len/8), oy-8, ox+i*(len/8), oy+8, color, 1);
  }
}

// Convergent series bar chart
function drawSeriesBars(cx, cy, progress) {
  const bars = [1/2,1/4,1/8,1/16,1/32,1/64];
  const W2 = 70, gap = 16;
  const maxH = 400;
  bars.forEach((v, i) => {
    const prog = clamp((progress - i*0.1)/0.6, 0, 1);
    const bh = v*maxH*prog;
    const bx = cx - (bars.length*(W2+gap))/2 + i*(W2+gap);
    const by = cy;
    // bar fill
    const col = i===0 ? PAL.blue : i===1 ? PAL.blueLt : i===2 ? PAL.purple : i===3 ? PAL.purpleDk : PAL.gray;
    for (let yy=by;yy>by-bh;yy-=PX) {
      px(bx, yy, W2, PX, col);
    }
    // bar border
    for (let yy=by;yy>by-bh;yy-=PX) {
      px(bx, yy, PX, PX, PAL.white);
      px(bx+W2-PX, yy, PX, PX, PAL.white);
    }
  });
}

// Stickman (Gojo silhouette power pose)
function drawGojoSilhouette(cx, cy, scale, color, glowColor) {
  const s = scale;
  // Body
  pixLine(cx, cy-80*s, cx, cy+60*s, color, 2);
  // Head
  pixCircle(cx, cy-100*s, 24*s, color, true);
  // Arms spread wide (power pose)
  pixLine(cx, cy-50*s, cx-150*s, cy+10*s, color, 2);
  pixLine(cx, cy-50*s, cx+150*s, cy+10*s, color, 2);
  // Legs
  pixLine(cx, cy+60*s, cx-50*s, cy+140*s, color, 2);
  pixLine(cx, cy+60*s, cx+50*s, cy+140*s, color, 2);
  // Glow
  if (glowColor) {
    ctx.globalAlpha=0.15;
    pixCircle(cx, cy, 180*s, glowColor, true);
    ctx.globalAlpha=0.08;
    pixCircle(cx, cy, 240*s, glowColor, true);
    ctx.globalAlpha=1;
  }
}

// Math formula renderer in pixel style
function drawPixelText(txt, x, y, size, color) {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px monospace`;
  ctx.fillText(txt, x, y);
  ctx.restore();
}

// Scene: which scene based on time
function getScene(t) {
  for (let i=STARTS.length-1;i>=0;i--) {
    if (t >= STARTS[i]) return { idx: i, local: t - STARTS[i], dur: TIMING[i] };
  }
  return { idx: 0, local: t, dur: TIMING[0] };
}

// Flash overlay
function flashOverlay(alpha, color) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
}

// Vignette
function drawVignette(strength) {
  const grad = ctx.createRadialGradient(W/2,H/2, H*0.3, W/2,H/2, H*0.9);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,`rgba(0,0,8,${strength})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

// Scanlines
function drawScanlines(alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000';
  for (let y=0;y<H;y+=PX*2) ctx.fillRect(0,y,W,PX);
  ctx.globalAlpha = 1;
}

// Caption bar
function drawCaption(txt, y, alpha) {
  if (alpha<=0) return;
  ctx.globalAlpha = alpha*0.85;
  ctx.fillStyle = '#000016';
  ctx.fillRect(40, y-50, W-80, 110);
  ctx.globalAlpha = alpha;
  ctx.save();
  ctx.fillStyle = PAL.white;
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  // Word-wrap simple
  const words = txt.split(' ');
  let lines2 = [], cur2 = '';
  words.forEach(w => {
    const test = cur2 ? cur2+' '+w : w;
    if (ctx.measureText(test).width > W-120) { lines2.push(cur2); cur2=w; }
    else cur2=test;
  });
  lines2.push(cur2);
  lines2.forEach((ln,i) => ctx.fillText(ln, W/2, y + i*44 - (lines2.length-1)*22));
  ctx.restore();
  ctx.globalAlpha = 1;
}

// === MAIN RENDER ===
window.render = function(t) {
  // Background
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0,0,W,H);

  const sc = getScene(t);
  const idx = sc.idx;
  const lt = sc.local;
  const dur = sc.dur;
  const prog = lt/dur;
  const inProg = ease(lt, 0.5);
  const outProg = ease(dur-lt, 0.4);
  const alpha = Math.min(inProg, outProg);
  const rng0 = mkRng(99);

  // Always draw starfield base
  drawStars(mkRng(1), 120, 0.6);

  // Per-scene rendering
  if (idx === 0) {
    // Hook: Title scene — Gojo silhouette with purple aura, pixel art, dramatic
    const rng = mkRng(10);
    // Purple energy ring
    const ringR = 300 + Math.sin(t*2)*20;
    for (let a=0;a<24;a++) {
      const ang = (a/24)*Math.PI*2 + t*0.5;
      const ex = W/2 + Math.cos(ang)*ringR;
      const ey = H*0.42 + Math.sin(ang)*ringR*0.3;
      ctx.globalAlpha = alpha*0.7;
      px(ex, ey, PX*3, PX*3, a%2===0 ? PAL.purple : PAL.blue);
    }
    ctx.globalAlpha=1;
    // Extra particle sparks
    for (let i=0;i<40;i++) {
      const ang = rng()*Math.PI*2;
      const r2 = 200+rng()*150;
      const ex = W/2+Math.cos(ang)*r2, ey = H*0.42+Math.sin(ang)*r2*0.4;
      ctx.globalAlpha=alpha*(0.3+rng()*0.7);
      px(ex,ey,PX,PX,rng()>0.5?PAL.purpleLt:PAL.blueLt);
    }
    ctx.globalAlpha=1;
    // Gojo silhouette power pose
    drawGojoSilhouette(W/2, H*0.42, 2.0, PAL.purpleDk, PAL.purple);
    // Pixel Gojo face centered
    drawGojo(W/2, H*0.42, 2, false, false);
    // Title text
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAL.purpleLt;
    ctx.font = 'bold 72px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOLLOW PURPLE', W/2, H*0.75);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 40px monospace';
    ctx.fillText('THE MATH BEHIND THE MYTH', W/2, H*0.80);
    ctx.restore();
    drawCaption(TXT[0], H*0.88, alpha);

  } else if (idx === 1) {
    // Zeno paradox — ancient Greek marble columns pixel art, philosopher
    const rng = mkRng(20);
    // Ground
    px(0, H*0.6, W, H*0.4, '#1a1020');
    for (let x=0;x<W;x+=PX*4) px(x, H*0.6, PX*4, PX, PAL.grayDk);
    // Marble columns
    [0.1,0.2,0.75,0.9].forEach((xf, i)=>{
      const cx2 = W*xf;
      for (let y=H*0.2;y<H*0.6;y+=PX) {
        const shade = (Math.sin(y*0.05+i)*0.5+0.5);
        const col = `rgb(${Math.floor(lerp(80,180,shade))},${Math.floor(lerp(80,180,shade))},${Math.floor(lerp(90,200,shade))})`;
        px(cx2, y, 48, PX, col);
      }
      // Capital
      px(cx2-32, H*0.2, 112, PX*4, '#c0c0d0');
    });
    // Stars through columns
    drawStars(mkRng(55), 40, 0.4);
    // Infinity symbol
    drawInfinity(W/2, H*0.35, 160, PAL.purple, prog);
    // Gojo and Zeno silhouettes
    drawGojoSilhouette(W*0.65, H*0.52, 1.0, PAL.purpleDk, null);
    drawGojo(W*0.65, H*0.52, 1, true, false);
    // Greek letter omega / phi decorative
    ctx.save();
    ctx.globalAlpha = alpha*0.6;
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 100px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('∞', W*0.3, H*0.42);
    ctx.restore();
    drawCaption(TXT[1], H*0.88, alpha);

  } else if (idx === 2) {
    // Halving distance — arrow zooming toward Gojo, halvings shown
    const rng = mkRng(30);
    const cx2 = W/2;
    // Pixel grid floor
    for (let x=0;x<W;x+=PX*8) px(x, H*0.65, PX*2, H*0.35, PAL.grayDk);
    px(0, H*0.65, W, PX*2, PAL.gray);
    // Gojo at right
    drawGojo(W*0.78, H*0.5, 1.5, true, false);
    // Halvings markers
    const halvings = [0.5,0.25,0.125,0.0625];
    halvings.forEach((v, i) => {
      const showP = clamp((prog - i*0.2)/0.3, 0, 1);
      const markerX = W*0.78 - v*W*0.6;
      ctx.globalAlpha = alpha*showP;
      // dashed vertical line
      for (let y=H*0.3;y<H*0.65;y+=PX*4) px(markerX, y, PX*2, PX*2, PAL.teal);
      // fraction label
      ctx.save();
      ctx.fillStyle = PAL.gold;
      ctx.font = `bold ${Math.max(20,32-i*4)}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(['1/2','1/4','1/8','1/16'][i], markerX, H*0.28);
      ctx.restore();
      ctx.globalAlpha=1;
    });
    // Arrow moving toward Gojo
    const arrowX = lerp(W*0.1, W*0.65, Math.min(prog*1.3,1));
    ctx.globalAlpha=alpha;
    px(arrowX-8, H*0.52, 40, PX*3, PAL.blue);
    // arrowhead
    for (let i=0;i<16;i+=PX) {
      px(arrowX+32, H*0.52+i-16, PX*4, PX, PAL.blue);
    }
    ctx.globalAlpha=1;
    drawCaption(TXT[2], H*0.88, alpha);

  } else if (idx === 3) {
    // Convergent series — infinite steps summing to 1
    const rng = mkRng(40);
    // Dark starfield
    drawStars(mkRng(66), 60, 0.5);
    // Animated sum approaching 1 bar
    const barW = W*0.7;
    const barH = PX*10;
    const bx = (W-barW)/2;
    const by2 = H*0.45;
    // Background bar
    px(bx, by2, barW, barH, PAL.grayDk);
    // Fill segments
    const segs = [0.5,0.25,0.125,0.0625,0.03125,0.015625];
    let cumX = bx;
    const segColors = [PAL.blue,PAL.purple,PAL.purpleLt,PAL.blueLt,PAL.teal,PAL.gray];
    segs.forEach((v,i) => {
      const showP = clamp((prog-i*0.1)/0.3, 0, 1);
      const segW = v*barW*showP;
      px(cumX, by2, segW, barH, segColors[i]);
      if (showP>0.1) {
        ctx.globalAlpha=alpha;
        ctx.save();
        ctx.fillStyle=PAL.white;
        ctx.font='bold 20px monospace';
        ctx.textAlign='center';
        ctx.fillText(`1/${Math.pow(2,i+1)}`, cumX+segW/2, by2-14);
        ctx.restore();
        ctx.globalAlpha=1;
      }
      cumX += v*barW;
    });
    // "= 1" marker
    ctx.globalAlpha=alpha*Math.min(prog*4,1);
    for (let y=by2-24;y<by2+barH+24;y+=PX) px(bx+barW, y, PX*2, PX, PAL.gold);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 56px monospace';
    ctx.textAlign='center';
    ctx.fillText('= 1', W*0.5, by2-50);
    ctx.restore();
    ctx.globalAlpha=1;
    // Gojo behind barrier
    drawGojo(W/2, H*0.68, 1.4, true, false);
    // Barrier shimmer
    for (let y=H*0.35;y<H*0.72;y+=PX*3) {
      ctx.globalAlpha=alpha*(0.2+Math.sin(t*8+y*0.05)*0.1);
      px(W/2-20, y, 40, PX*2, PAL.blueLt);
    }
    ctx.globalAlpha=1;
    drawCaption(TXT[3], H*0.88, alpha);

  } else if (idx === 4) {
    // The sum formula: 1/2+1/4+1/8... = 1 — big pixel math
    const rng = mkRng(50);
    drawStars(mkRng(77), 60, 0.4);
    // Glowing formula
    const fProg = ease(lt, 0.8);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 70px monospace';
    ctx.textAlign = 'center';
    if (prog > 0.1) ctx.fillText('½', W/2-320, H*0.38);
    if (prog > 0.25) { ctx.fillStyle=PAL.white; ctx.fillText('+', W/2-230, H*0.38); ctx.fillStyle=PAL.blue; }
    if (prog > 0.35) ctx.fillText('¼', W/2-150, H*0.38);
    if (prog > 0.5) { ctx.fillStyle=PAL.white; ctx.fillText('+', W/2-55, H*0.38); ctx.fillStyle=PAL.purple; }
    if (prog > 0.6) ctx.fillText('⅛', W/2+30, H*0.38);
    if (prog > 0.72) { ctx.fillStyle=PAL.white; ctx.fillText('+···', W/2+170, H*0.38); }
    if (prog > 0.82) { ctx.fillStyle=PAL.gold; ctx.font='bold 90px monospace'; ctx.fillText('= 1', W/2, H*0.52); }
    ctx.restore();
    ctx.globalAlpha=1;
    // Infinite dots approaching a wall
    for (let i=0;i<12;i++) {
      const dotX = W*0.75 - Math.pow(0.6,i)*W*0.55;
      const showP = clamp((prog-i*0.07)/0.2,0,1);
      ctx.globalAlpha=alpha*showP;
      pixCircle(dotX, H*0.65, (12-i)*2, PAL.teal, true);
    }
    ctx.globalAlpha=1;
    // Wall (Gojo's infinity)
    for (let y=H*0.58;y<H*0.72;y+=PX*2) {
      ctx.globalAlpha=alpha*(0.4+Math.sin(t*6+y*0.1)*0.2);
      px(W*0.75, y, PX*3, PX*2, PAL.blueLt);
    }
    ctx.globalAlpha=1;
    drawGojo(W*0.78, H*0.65, 1.2, true, false);
    drawCaption(TXT[4], H*0.88, alpha);

  } else if (idx === 5) {
    // Convergent series graph — bar chart building up
    const rng = mkRng(60);
    drawStars(mkRng(88), 50, 0.3);
    // Axes
    ctx.globalAlpha=alpha;
    drawAxis(W/2, H*0.6, 700, PAL.gray);
    // Bars
    drawSeriesBars(W/2, H*0.6, prog);
    // Convergence label
    ctx.save();
    ctx.globalAlpha=alpha*Math.min(prog*3,1);
    ctx.fillStyle=PAL.purple;
    ctx.font='bold 48px monospace';
    ctx.textAlign='center';
    ctx.fillText('CONVERGENT', W/2, H*0.72);
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 40px monospace';
    ctx.fillText('INFINITE SERIES', W/2, H*0.78);
    ctx.restore();
    ctx.globalAlpha=1;
    // Gojo small top right
    drawGojo(W*0.82, H*0.22, 1, true, false);
    drawCaption(TXT[5], H*0.88, alpha);

  } else if (idx === 6) {
    // Infinity barrier — Gojo standing, objects slowing near him
    const rng = mkRng(70);
    drawStars(mkRng(99), 80, 0.5);
    // Gojo center with barrier rings
    const numRings = 6;
    for (let r=0;r<numRings;r++) {
      const rr = 80 + r*55;
      const ringAlpha = alpha*(0.6-r*0.08)*(0.5+Math.sin(t*3+r)*0.3);
      ctx.globalAlpha=ringAlpha;
      pixCircle(W/2, H*0.45, rr, r%2===0?PAL.blue:PAL.purple, false);
    }
    ctx.globalAlpha=1;
    drawGojo(W/2, H*0.45, 1.8, true, false);
    // Objects approaching and slowing
    const objRng = mkRng(55);
    for (let i=0;i<8;i++) {
      const angle = (i/8)*Math.PI*2;
      const baseSpd = 300;
      // hyperbolic slowdown near center
      const startDist = 500;
      // integrate: dist decreases but slows near 0
      const rawDist = startDist*(1 - clamp(prog,0,0.95));
      const slowed = rawDist*rawDist/startDist + 80;
      const ox = W/2 + Math.cos(angle)*slowed;
      const oy = H*0.45 + Math.sin(angle)*slowed*0.6;
      ctx.globalAlpha=alpha;
      px(ox-8, oy-8, 16, 16, objRng()>0.5?PAL.red:PAL.gold);
      // speed lines
      for (let j=1;j<4;j++) {
        const trailD = slowed+j*20;
        ctx.globalAlpha=alpha*(0.4-j*0.1);
        px(W/2+Math.cos(angle)*trailD-4, H*0.45+Math.sin(angle)*trailD*0.6-4, 8, 8, PAL.gray);
      }
      ctx.globalAlpha=1;
    }
    drawCaption(TXT[6], H*0.88, alpha);

  } else if (idx === 7) {
    // Blue — Convergence. Big Blue orb, lines converging
    const rng = mkRng(80);
    drawStars(mkRng(11), 70, 0.4);
    // Blue glow
    ctx.globalAlpha=alpha*0.3;
    pixCircle(W/2, H*0.4, 350, PAL.blue, true);
    ctx.globalAlpha=alpha*0.15;
    pixCircle(W/2, H*0.4, 420, PAL.blueLt, true);
    ctx.globalAlpha=1;
    // Convergence lines
    drawConvergence(W/2, H*0.4, 24, prog, PAL.blue);
    // Core orb
    pixCircle(W/2, H*0.4, 60*(0.5+prog*0.5), PAL.blue, true);
    pixCircle(W/2, H*0.4, 40*(0.5+prog*0.5), PAL.blueLt, true);
    pixCircle(W/2, H*0.4, 16, PAL.white, true);
    // Label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.blueLt;
    ctx.font='bold 100px monospace';
    ctx.textAlign='center';
    ctx.fillText('BLUE', W/2, H*0.72);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 48px monospace';
    ctx.fillText('CONVERGENCE', W/2, H*0.80);
    ctx.restore();
    ctx.globalAlpha=1;
    // Mini Gojo
    drawGojo(W*0.78, H*0.25, 1, true, false);
    drawCaption(TXT[7], H*0.88, alpha);

  } else if (idx === 8) {
    // Red — Divergence. Big Red orb, lines exploding outward
    const rng = mkRng(90);
    drawStars(mkRng(22), 70, 0.4);
    // Red glow
    ctx.globalAlpha=alpha*0.3;
    pixCircle(W/2, H*0.4, 350, PAL.red, true);
    ctx.globalAlpha=alpha*0.15;
    pixCircle(W/2, H*0.4, 420, PAL.redLt, true);
    ctx.globalAlpha=1;
    // Divergence lines
    drawDivergence(W/2, H*0.4, 24, prog, PAL.red);
    // Core orb
    pixCircle(W/2, H*0.4, 60*(0.5+prog*0.5), PAL.red, true);
    pixCircle(W/2, H*0.4, 40*(0.5+prog*0.5), PAL.redLt, true);
    pixCircle(W/2, H*0.4, 16, PAL.white, true);
    // Shockwave rings
    for (let r=0;r<4;r++) {
      const rr = 80 + r*60 + prog*180;
      if (rr < 480) {
        ctx.globalAlpha=alpha*(1-rr/480)*0.5;
        pixCircle(W/2, H*0.4, rr, PAL.redLt, false);
      }
    }
    ctx.globalAlpha=1;
    // Label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.redLt;
    ctx.font='bold 100px monospace';
    ctx.textAlign='center';
    ctx.fillText('RED', W/2, H*0.72);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 48px monospace';
    ctx.fillText('DIVERGENCE', W/2, H*0.80);
    ctx.restore();
    ctx.globalAlpha=1;
    // Mini Gojo
    drawGojo(W*0.78, H*0.25, 1, true, false);
    drawCaption(TXT[8], H*0.88, alpha);

  } else if (idx === 9) {
    // Real math vs fiction — split screen
    const rng = mkRng(100);
    drawStars(mkRng(33), 60, 0.4);
    // Divider
    for (let y=0;y<H*0.75;y+=PX*2) px(W/2-PX, y, PX*2, PX*2, PAL.gray);
    // Left: real math label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.teal;
    ctx.font='bold 44px monospace';
    ctx.textAlign='center';
    ctx.fillText('REAL MATH', W*0.25, H*0.18);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 30px monospace';
    ctx.fillText('convergence', W*0.25, H*0.26);
    ctx.fillText('divergence', W*0.25, H*0.32);
    ctx.fillStyle=PAL.gray;
    ctx.font='bold 26px monospace';
    ctx.fillText('concepts in', W*0.25, H*0.40);
    ctx.fillText('calculus/series', W*0.25, H*0.46);
    ctx.restore();
    // Right: Gojo fiction label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.purple;
    ctx.font='bold 44px monospace';
    ctx.textAlign='center';
    ctx.fillText('FICTION', W*0.75, H*0.18);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 30px monospace';
    ctx.fillText('attraction force', W*0.75, H*0.26);
    ctx.fillText('repulsion force', W*0.75, H*0.32);
    ctx.restore();
    // Gojo pixel art on right
    drawGojo(W*0.75, H*0.52, 1.4, true, false);
    // Math symbols on left
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 80px monospace';
    ctx.textAlign='center';
    ctx.fillText('∑', W*0.25, H*0.62);
    ctx.restore();
    drawCaption(TXT[9], H*0.88, alpha);

  } else if (idx === 10) {
    // Blue and Red collide
    const rng = mkRng(110);
    drawStars(mkRng(44), 60, 0.5);
    const collideT = clamp(prog, 0, 1);
    const blueX = W*0.5 - (1-collideT)*W*0.3;
    const redX = W*0.5 + (1-collideT)*W*0.3;
    // Blue orb
    ctx.globalAlpha=alpha*0.5;
    pixCircle(blueX, H*0.42, 100, PAL.blue, true);
    ctx.globalAlpha=1;
    pixCircle(blueX, H*0.42, 80, PAL.blue, false);
    pixCircle(blueX, H*0.42, 40, PAL.blueLt, true);
    // Red orb
    ctx.globalAlpha=alpha*0.5;
    pixCircle(redX, H*0.42, 100, PAL.red, true);
    ctx.globalAlpha=1;
    pixCircle(redX, H*0.42, 80, PAL.red, false);
    pixCircle(redX, H*0.42, 40, PAL.redLt, true);
    // Collision flash at center when close
    if (collideT > 0.7) {
      const flashA = (collideT-0.7)/0.3;
      ctx.globalAlpha=alpha*flashA*0.8;
      pixCircle(W/2, H*0.42, 150*flashA, PAL.purpleLt, true);
      ctx.globalAlpha=1;
    }
    // Labels
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.blueLt;
    ctx.font='bold 56px monospace';
    ctx.textAlign='center';
    ctx.fillText('BLUE', blueX, H*0.62);
    ctx.fillStyle=PAL.redLt;
    ctx.fillText('RED', redX, H*0.62);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 40px monospace';
    ctx.fillText('+', W/2, H*0.62);
    ctx.restore();
    ctx.globalAlpha=1;
    drawCaption(TXT[10], H*0.88, alpha);

  } else if (idx === 11) {
    // Hollow Purple — the imaginary mass
    const rng = mkRng(120);
    drawStars(mkRng(55), 80, 0.6);
    // Purple vortex
    for (let ring=0;ring<8;ring++) {
      const rr = 60+ring*50 + Math.sin(t*2+ring)*20;
      const ringA = alpha*(0.8-ring*0.08)*(0.6+Math.sin(t*3+ring*0.7)*0.3);
      ctx.globalAlpha=ringA;
      for (let a=0;a<32;a++) {
        const ang = (a/32)*Math.PI*2 + t*(ring%2===0?1:-1)*0.5;
        const px2 = W/2+Math.cos(ang)*rr;
        const py2 = H*0.42+Math.sin(ang)*rr;
        px(px2-PX,py2-PX,PX*3,PX*3,ring%3===0?PAL.purple:ring%3===1?PAL.blue:PAL.purpleLt);
      }
    }
    ctx.globalAlpha=1;
    // Core bright purple
    pixCircle(W/2, H*0.42, 50, PAL.purpleLt, true);
    pixCircle(W/2, H*0.42, 24, PAL.white, true);
    // Gojo both arms out
    drawGojoSilhouette(W/2, H*0.72, 1.6, PAL.purpleDk, PAL.purple);
    drawGojo(W/2, H*0.72, 1.4, false, true);
    // Label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.purpleLt;
    ctx.font='bold 80px monospace';
    ctx.textAlign='center';
    ctx.fillText('HOLLOW', W/2, H*0.17);
    ctx.fillStyle=PAL.white;
    ctx.fillText('PURPLE', W/2, H*0.24);
    ctx.restore();
    ctx.globalAlpha=1;
    drawCaption(TXT[11], H*0.88, alpha);

  } else if (idx === 12) {
    // Imaginary numbers — i = sqrt(-1)
    const rng = mkRng(130);
    drawStars(mkRng(66), 60, 0.4);
    // Complex plane
    ctx.globalAlpha=alpha;
    drawAxis(W/2, H*0.45, 700, PAL.grayDk);
    // Real axis label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.gray;
    ctx.font='bold 32px monospace';
    ctx.textAlign='center';
    ctx.fillText('Real', W/2+340, H*0.45+30);
    ctx.fillText('Imaginary', W/2-20, H*0.45-340);
    ctx.restore();
    // i point on imaginary axis
    const iProg = ease(lt-0.5, 0.6);
    pixCircle(W/2, H*0.45-200*iProg, 20, PAL.purple, true);
    ctx.globalAlpha=alpha;
    ctx.save();
    ctx.fillStyle=PAL.purpleLt;
    ctx.font='bold 56px monospace';
    ctx.textAlign='center';
    if (prog>0.2) ctx.fillText('i = √-1', W/2, H*0.45-220*iProg-20);
    if (prog>0.5) {
      ctx.fillStyle=PAL.gold;
      ctx.font='bold 48px monospace';
      ctx.fillText('i² = -1', W/2, H*0.75);
    }
    ctx.restore();
    ctx.globalAlpha=1;
    // Spiral on complex plane
    for (let a=0;a<clamp(prog,0,1)*180;a++) {
      const ang = (a/60)*Math.PI*2;
      const r2 = a*1.8;
      const spx = W/2+Math.cos(ang)*r2;
      const spy = H*0.45-Math.sin(ang)*r2;
      ctx.globalAlpha=alpha*(a/180)*0.8;
      px(spx-PX,spy-PX,PX*2,PX*2,a%3===0?PAL.purple:a%3===1?PAL.blue:PAL.purpleLt);
    }
    ctx.globalAlpha=1;
    drawCaption(TXT[12], H*0.88, alpha);

  } else if (idx === 13) {
    // RIKEN collaboration — Japan lab, manga panel style
    const rng = mkRng(140);
    drawStars(mkRng(77), 40, 0.3);
    // Panel borders pixel art
    px(40, 80, W-80, PX*3, PAL.gray);
    px(40, 80, PX*3, H*0.7-80, PAL.gray);
    px(40, H*0.7, W-80, PX*3, PAL.gray);
    px(W-43, 80, PX*3, H*0.7-80, PAL.gray);
    // Inside: Gojo + scientist figure
    drawGojo(W*0.65, H*0.42, 1.5, false, false);
    // Scientist stickfigure
    pixCircle(W*0.3, H*0.28, 24, PAL.white, false);
    pixLine(W*0.3, H*0.28+24, W*0.3, H*0.28+100, PAL.white, 1);
    pixLine(W*0.3, H*0.28+50, W*0.22, H*0.28+80, PAL.white, 1);
    pixLine(W*0.3, H*0.28+50, W*0.38, H*0.28+80, PAL.white, 1);
    pixLine(W*0.3, H*0.28+100, W*0.22, H*0.28+160, PAL.white, 1);
    pixLine(W*0.3, H*0.28+100, W*0.38, H*0.28+160, PAL.white, 1);
    // Math floating
    ctx.save();
    ctx.globalAlpha=alpha*Math.min(prog*3,1);
    ctx.fillStyle=PAL.teal;
    ctx.font='bold 36px monospace';
    ctx.textAlign='center';
    ctx.fillText('RIKEN', W*0.3, H*0.58);
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 28px monospace';
    ctx.fillText('Japan Science Institute', W/2, H*0.65);
    ctx.fillStyle=PAL.purple;
    ctx.font='bold 32px monospace';
    ctx.fillText('× JJK Collaboration', W/2, H*0.70);
    ctx.restore();
    ctx.globalAlpha=1;
    // Floating math symbols
    ['∑','∞','i','√','π','∂'].forEach((sym,i)=>{
      const sx = 100+i*(W-200)/5;
      const sy = H*0.1 + Math.sin(t*2+i)*20;
      ctx.globalAlpha=alpha*(0.4+Math.sin(t+i*0.9)*0.3);
      ctx.save();
      ctx.fillStyle=[PAL.gold,PAL.purple,PAL.blue,PAL.teal,PAL.gold,PAL.purple][i];
      ctx.font='bold 48px monospace';
      ctx.textAlign='center';
      ctx.fillText(sym, sx, sy);
      ctx.restore();
      ctx.globalAlpha=1;
    });
    drawCaption(TXT[13], H*0.88, alpha);

  } else if (idx === 14) {
    // Six Eyes — precision control
    const rng = mkRng(150);
    drawStars(mkRng(88), 70, 0.5);
    // Gojo without blindfold, Six Eyes glowing
    drawGojoSilhouette(W/2, H*0.5, 2.0, PAL.purpleDk, PAL.blue);
    drawGojo(W/2, H*0.5, 2.2, false, true);
    // Six Eyes light rays
    for (let i=0;i<16;i++) {
      const ang = (i/16)*Math.PI*2;
      const len = 80 + Math.sin(t*4+i)*30;
      const ex = W/2 + Math.cos(ang)*len*prog;
      const ey = H*0.5 + Math.sin(ang)*len*prog*0.6;
      ctx.globalAlpha=alpha*(0.5+Math.sin(t*3+i)*0.3)*prog;
      px(ex-PX,ey-PX,PX*2,PX*2,i%2===0?PAL.blueLt:PAL.teal);
    }
    ctx.globalAlpha=1;
    // SIX EYES label
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.teal;
    ctx.font='bold 70px monospace';
    ctx.textAlign='center';
    ctx.fillText('SIX EYES', W/2, H*0.17);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 36px monospace';
    ctx.fillText('Perfect precision', W/2, H*0.24);
    ctx.fillText('over cursed energy', W/2, H*0.29);
    ctx.restore();
    ctx.globalAlpha=1;
    drawCaption(TXT[14], H*0.88, alpha);

  } else if (idx === 15) {
    // Finale: Hollow Purple full blast
    const rng = mkRng(160);
    drawStars(mkRng(99), 100, 0.7);
    // Full screen purple explosion rings
    for (let ring=0;ring<12;ring++) {
      const rr = 40+ring*80 + prog*200;
      const ringA = alpha*(1-rr/(W*0.9))*(0.7+Math.sin(t*4+ring)*0.3);
      if (ringA>0 && rr < W) {
        ctx.globalAlpha=ringA;
        pixCircle(W/2, H*0.42, rr, ring%3===0?PAL.purple:ring%3===1?PAL.blue:PAL.purpleLt, false);
      }
    }
    ctx.globalAlpha=1;
    // Gojo full power
    drawGojoSilhouette(W/2, H*0.68, 2.2, PAL.purpleDk, PAL.purple);
    drawGojo(W/2, H*0.68, 2.0, false, true);
    // Particles exploding out
    const pRng = mkRng(77);
    for (let i=0;i<60;i++) {
      const ang = pRng()*Math.PI*2;
      const r2 = prog*600*pRng();
      const ex = W/2+Math.cos(ang)*r2;
      const ey = H*0.42+Math.sin(ang)*r2*0.6;
      if (ex>0&&ex<W&&ey>0&&ey<H) {
        ctx.globalAlpha=alpha*(1-r2/600)*0.9;
        px(ex-PX,ey-PX,PX*(1+Math.floor(pRng()*3)),PX*(1+Math.floor(pRng()*3)),
           pRng()>0.5?PAL.purple:pRng()>0.5?PAL.blue:PAL.purpleLt);
      }
    }
    ctx.globalAlpha=1;
    // Title finale
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.purpleLt;
    ctx.font='bold 88px monospace';
    ctx.textAlign='center';
    ctx.fillText('HOLLOW', W/2, H*0.17);
    ctx.fillStyle=PAL.white;
    ctx.fillText('PURPLE', W/2, H*0.25);
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 40px monospace';
    ctx.fillText('Math made technique.', W/2, H*0.33);
    ctx.restore();
    ctx.globalAlpha=1;
    drawCaption(TXT[15], H*0.88, alpha);
  }

  // Vignette + scanlines always
  drawVignette(0.5);
  drawScanlines(0.03);
};

window.__ready = true;
</script>
</body>
</html>
