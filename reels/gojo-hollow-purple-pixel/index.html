<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;width:1080px;height:1920px}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const TXT=[
  "The most powerful technique in Jujutsu Kaisen... is built on real mathematics.",
  "Gojo's Infinity technique comes from an ancient paradox -- posed by the Greek philosopher Zeno.",
  "To reach Gojo, you must cross half the distance. Then half of that. Then half again.",
  "Infinitely many steps... yet they all add up to exactly one.",
  "One half plus one quarter plus one eighth... forever -- converges to one.",
  "This is a convergent infinite series. Infinite steps, finite result.",
  "Gojo's Infinity uses this idea -- anything approaching him is slowed through infinite subdivision.",
  "Blue is Convergence. Space collapses inward. Everything is pulled toward a single point.",
  "Red is Divergence. The reverse. An explosive force that pushes everything away.",
  "In real math, convergence and divergence don't create forces. Gojo's power is fiction inspired by the concept.",
  "But combine them -- and something new appears.",
  "An imaginary mass. A phenomenon that shouldn't exist... rushing toward you.",
  "Imaginary numbers are real mathematics. The square root of negative one. Used in quantum physics and engineering.",
  "Gege Akutami even worked with RIKEN -- Japan's top science institute -- to explain the math behind Limitless.",
  "The Six Eyes let Gojo perceive cursed energy with perfect precision. That's what makes combining Blue and Red possible.",
  "Hollow Purple. The void technique. Born where convergence meets divergence -- in the space between real and imaginary."
];

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 1080, H = 1920;
const PX = 4;

const TIMING = [4, 3.8, 3.8, 3.8, 3.8, 3.8, 4, 4, 4, 4, 3.5, 3.5, 4, 4, 4, 4];
let cs = 0.5;
const STARTS = [];
TXT.forEach(function(_, i) { STARTS[i] = cs; cs += TIMING[i]; });

const PAL = {
  bg:       '#050510',
  darkBg:   '#08081a',
  purple:   '#9b30ff',
  purpleDk: '#5500cc',
  purpleLt: '#cc88ff',
  blue:     '#1a88ff',
  blueLt:   '#66aaff',
  red:      '#ff2244',
  redLt:    '#ff6688',
  gold:     '#ffcc00',
  white:    '#f0f0ff',
  gray:     '#8888aa',
  grayDk:   '#333355',
  teal:     '#00ddcc',
  black:    '#000008'
};

function drawPx(x, y, w, h, color) {
  ctx.fillStyle = color;
  var rx = Math.round(x/PX)*PX, ry = Math.round(y/PX)*PX;
  var rw = Math.round(w/PX)*PX||PX, rh = Math.round(h/PX)*PX||PX;
  ctx.fillRect(rx, ry, rw, rh);
}

function ease(t, d) {
  var p = Math.max(0, Math.min(1, t / d));
  return p < 0.5 ? 2*p*p : -1+(4-2*p)*p;
}

function lerp(a, b, t) { return a + (b-a)*t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function mkRng(seed) {
  var s = seed;
  return function() { s = (s*1664525 + 1013904223) & 0xffffffff; return (s>>>0)/4294967296; };
}

function pixCircle(cx, cy, r, color, fill) {
  var step = PX;
  for (var dy = -r; dy <= r; dy += step) {
    for (var dx2 = -r; dx2 <= r; dx2 += step) {
      var dist = Math.sqrt(dx2*dx2+dy*dy);
      if (fill ? dist <= r : (dist >= r-PX*2 && dist <= r)) {
        drawPx(cx+dx2, cy+dy, step, step, color);
      }
    }
  }
}

function pixLine(x1,y1,x2,y2,color,thick) {
  if (!thick) thick=1;
  var ddx = x2-x1, ddy = y2-y1;
  var len = Math.sqrt(ddx*ddx+ddy*ddy);
  var steps = Math.ceil(len/PX);
  for (var i=0;i<=steps;i++) {
    var tt = i/steps;
    drawPx(x1+ddx*tt-thick/2, y1+ddy*tt-thick/2, thick*PX, thick*PX, color);
  }
}

function drawStars(rng, count, alpha) {
  for (var i=0;i<count;i++) {
    var sx = rng()*W, sy = rng()*H;
    var br = rng() > 0.85 ? PAL.white : (rng()>0.5 ? PAL.blueLt : PAL.purpleLt);
    ctx.globalAlpha = alpha * (0.3 + rng()*0.7);
    drawPx(sx, sy, PX, PX, br);
  }
  ctx.globalAlpha = 1;
}

function drawGojo(cx, cy, scale, blindfold, blueEyes) {
  var s = scale;
  var hairRng = mkRng(42);
  for (var ddy=-9;ddy<=-4;ddy++) {
    for (var ddx=-4;ddx<=4;ddx++) {
      var dist = Math.abs(ddx)+Math.abs(ddy+6.5);
      if (dist < 7 + hairRng()*1.5) {
        drawPx(cx+ddx*8*s, cy+ddy*8*s, 8*s, 8*s, '#e8e8f0');
      }
    }
  }
  for (var ddy2=-6;ddy2<=-2;ddy2++) {
    drawPx(cx-4*8*s, cy+ddy2*8*s, 8*s, 8*s, '#d8d8e8');
    drawPx(cx+4*8*s, cy+ddy2*8*s, 8*s, 8*s, '#d8d8e8');
    drawPx(cx-5*8*s, cy+ddy2*8*s, 8*s, 8*s, '#c0c0d0');
    drawPx(cx+5*8*s, cy+ddy2*8*s, 8*s, 8*s, '#c0c0d0');
  }
  [[-5,-10],[-3,-11],[-1,-12],[1,-12],[3,-11],[5,-10],[-6,-8],[6,-8]].forEach(function(pair){
    drawPx(cx+pair[0]*8*s, cy+pair[1]*8*s, 8*s, 8*s, '#d0d0e0');
  });
  for (var fdy=-4;fdy<=3;fdy++) {
    for (var fdx=-3;fdx<=3;fdx++) {
      drawPx(cx+fdx*8*s, cy+fdy*8*s, 8*s, 8*s, '#f5deb3');
    }
  }
  if (blindfold) {
    for (var bdx=-3;bdx<=3;bdx++) {
      drawPx(cx+bdx*8*s, cy-1*8*s, 8*s, 8*s, '#111122');
      drawPx(cx+bdx*8*s, cy+0*8*s, 8*s, 8*s, '#1a1a2e');
    }
  } else {
    drawPx(cx-2*8*s, cy-1*8*s, 8*s, 8*s, blueEyes?'#44ddff':'#00aaff');
    drawPx(cx+2*8*s, cy-1*8*s, 8*s, 8*s, blueEyes?'#44ddff':'#00aaff');
    if (blueEyes) {
      ctx.globalAlpha=0.4;
      pixCircle(cx-2*8*s+4*s, cy-1*8*s+4*s, 16*s, '#44ddff', true);
      pixCircle(cx+2*8*s+4*s, cy-1*8*s+4*s, 16*s, '#44ddff', true);
      ctx.globalAlpha=1;
    }
  }
  drawPx(cx, cy+1*8*s, 4*s, 4*s, '#d4a070');
  for (var mdx=-1;mdx<=1;mdx++) drawPx(cx+mdx*8*s, cy+2*8*s, 8*s, 4*s, '#c08060');
  for (var udy=4;udy<=10;udy++) {
    for (var udx=-4;udx<=4;udx++) drawPx(cx+udx*8*s, cy+udy*8*s, 8*s, 8*s, '#1a1a3a');
  }
  drawPx(cx-1*8*s, cy+4*8*s, 8*s, 8*s, '#2a2a5a');
  drawPx(cx+1*8*s, cy+4*8*s, 8*s, 8*s, '#2a2a5a');
}

function drawGojoSilhouette(cx, cy, scale, color, glowColor) {
  var s = scale;
  pixLine(cx, cy-80*s, cx, cy+60*s, color, 2);
  pixCircle(cx, cy-100*s, 24*s, color, true);
  pixLine(cx, cy-50*s, cx-150*s, cy+10*s, color, 2);
  pixLine(cx, cy-50*s, cx+150*s, cy+10*s, color, 2);
  pixLine(cx, cy+60*s, cx-50*s, cy+140*s, color, 2);
  pixLine(cx, cy+60*s, cx+50*s, cy+140*s, color, 2);
  if (glowColor) {
    ctx.globalAlpha=0.15; pixCircle(cx, cy, 180*s, glowColor, true);
    ctx.globalAlpha=0.08; pixCircle(cx, cy, 240*s, glowColor, true);
    ctx.globalAlpha=1;
  }
}

function drawInfinity(cx, cy, r, color, progress) {
  var steps = 120;
  var lim = Math.floor(steps*clamp(progress,0,1));
  for (var i=0;i<lim;i++) {
    var theta = (i/steps)*Math.PI*2;
    var denom = 1+Math.sin(theta)*Math.sin(theta);
    var ix = cx + r*Math.cos(theta)/denom;
    var iy = cy + r*Math.sin(theta)*Math.cos(theta)/denom;
    drawPx(ix-PX/2, iy-PX/2, PX*2, PX*2, color);
  }
}

function drawConvergence(cx, cy, numLines, t, color) {
  for (var i=0;i<numLines;i++) {
    var angle = (i/numLines)*Math.PI*2;
    var dist = 400 - t*380;
    var x1 = cx + Math.cos(angle)*clamp(dist,20,500);
    var y1 = cy + Math.sin(angle)*clamp(dist,20,500);
    ctx.globalAlpha = 0.4+clamp(t,0,1)*0.5;
    pixLine(x1, y1, cx+Math.cos(angle)*20, cy+Math.sin(angle)*20, color, 1);
  }
  ctx.globalAlpha=1;
}

function drawDivergence(cx, cy, numLines, t, color) {
  for (var i=0;i<numLines;i++) {
    var angle = (i/numLines)*Math.PI*2;
    var dist2 = 20 + t*380;
    var x2b = cx + Math.cos(angle)*clamp(dist2,20,500);
    var y2b = cy + Math.sin(angle)*clamp(dist2,20,500);
    ctx.globalAlpha = 0.4+clamp(t,0,1)*0.3;
    pixLine(cx+Math.cos(angle)*20, cy+Math.sin(angle)*20, x2b, y2b, color, 1);
  }
  ctx.globalAlpha=1;
}

function drawAxis(ox, oy, len, color) {
  pixLine(ox-len/2, oy, ox+len/2, oy, color, 1);
  pixLine(ox, oy-len/2, ox, oy+len/2, color, 1);
  for (var i=-4;i<=4;i++) pixLine(ox+i*(len/8), oy-8, ox+i*(len/8), oy+8, color, 1);
}

function drawSeriesBars(cx, cy, progress) {
  var bars = [0.5,0.25,0.125,0.0625,0.03125,0.015625];
  var BW = 70, gap = 16;
  var maxH = 400;
  var segColors = [PAL.blue,PAL.blueLt,PAL.purple,PAL.purpleDk,PAL.gray,PAL.grayDk];
  bars.forEach(function(v, i) {
    var prog = clamp((progress - i*0.1)/0.6, 0, 1);
    var bh = v*maxH*prog;
    var bx = cx - (bars.length*(BW+gap))/2 + i*(BW+gap);
    for (var yy=cy;yy>cy-bh;yy-=PX) {
      drawPx(bx, yy, BW, PX, segColors[i]);
      drawPx(bx, yy, PX, PX, PAL.white);
      drawPx(bx+BW-PX, yy, PX, PX, PAL.white);
    }
  });
}

function drawVignette(strength) {
  var grad = ctx.createRadialGradient(W/2,H/2, H*0.3, W/2,H/2, H*0.9);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,8,'+strength+')');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawScanlines(alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000';
  for (var y=0;y<H;y+=PX*2) ctx.fillRect(0,y,W,PX);
  ctx.globalAlpha = 1;
}

function drawCaption(txt, y, alpha) {
  if (alpha<=0) return;
  ctx.globalAlpha = alpha*0.85;
  ctx.fillStyle = '#000016';
  ctx.fillRect(40, y-50, W-80, 110);
  ctx.globalAlpha = alpha;
  ctx.save();
  ctx.fillStyle = PAL.white;
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  var words = txt.split(' ');
  var lines2 = [], cur2 = '';
  words.forEach(function(w) {
    var test = cur2 ? cur2+' '+w : w;
    if (ctx.measureText(test).width > W-120) { lines2.push(cur2); cur2=w; }
    else cur2=test;
  });
  lines2.push(cur2);
  lines2.forEach(function(ln,i) { ctx.fillText(ln, W/2, y + i*44 - (lines2.length-1)*22); });
  ctx.restore();
  ctx.globalAlpha = 1;
}

function getScene(t) {
  for (var i=STARTS.length-1;i>=0;i--) {
    if (t >= STARTS[i]) return { idx: i, local: t - STARTS[i], dur: TIMING[i] };
  }
  return { idx: 0, local: t, dur: TIMING[0] };
}

window.render = function(t) {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0,0,W,H);

  var sc = getScene(t);
  var idx = sc.idx;
  var lt = sc.local;
  var dur = sc.dur;
  var prog = lt/dur;
  var inProg = ease(lt, 0.5);
  var outProg = ease(dur-lt, 0.4);
  var alpha = Math.min(inProg, outProg);

  drawStars(mkRng(1), 120, 0.6);

  if (idx === 0) {
    var rng = mkRng(10);
    var ringR = 300 + Math.sin(t*2)*20;
    for (var a=0;a<24;a++) {
      var ang = (a/24)*Math.PI*2 + t*0.5;
      var ex = W/2 + Math.cos(ang)*ringR;
      var ey = H*0.42 + Math.sin(ang)*ringR*0.3;
      ctx.globalAlpha = alpha*0.7;
      drawPx(ex, ey, PX*3, PX*3, a%2===0 ? PAL.purple : PAL.blue);
    }
    ctx.globalAlpha=1;
    for (var i=0;i<40;i++) {
      var ang2 = rng()*Math.PI*2;
      var r2 = 200+rng()*150;
      var ex2 = W/2+Math.cos(ang2)*r2, ey2 = H*0.42+Math.sin(ang2)*r2*0.4;
      ctx.globalAlpha=alpha*(0.3+rng()*0.7);
      drawPx(ex2,ey2,PX,PX,rng()>0.5?PAL.purpleLt:PAL.blueLt);
    }
    ctx.globalAlpha=1;
    drawGojoSilhouette(W/2, H*0.42, 2.0, PAL.purpleDk, PAL.purple);
    drawGojo(W/2, H*0.42, 2, false, false);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = PAL.purpleLt;
    ctx.font = 'bold 72px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOLLOW PURPLE', W/2, H*0.75);
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 40px monospace';
    ctx.fillText('THE MATH BEHIND THE MYTH', W/2, H*0.80);
    ctx.restore();
    drawCaption(TXT[0], H*0.88, alpha);

  } else if (idx === 1) {
    drawPx(0, H*0.6, W, H*0.4, '#1a1020');
    for (var x=0;x<W;x+=PX*4) drawPx(x, H*0.6, PX*4, PX, PAL.grayDk);
    [0.1,0.2,0.75,0.9].forEach(function(xf, ci) {
      var cx2b = W*xf;
      for (var y=H*0.2;y<H*0.6;y+=PX) {
        var shade = (Math.sin(y*0.05+ci)*0.5+0.5);
        var col = 'rgb('+Math.floor(lerp(80,180,shade))+','+Math.floor(lerp(80,180,shade))+','+Math.floor(lerp(90,200,shade))+')';
        drawPx(cx2b, y, 48, PX, col);
      }
      drawPx(cx2b-32, H*0.2, 112, PX*4, '#c0c0d0');
    });
    drawStars(mkRng(55), 40, 0.4);
    drawInfinity(W/2, H*0.35, 160, PAL.purple, prog);
    drawGojoSilhouette(W*0.65, H*0.52, 1.0, PAL.purpleDk, null);
    drawGojo(W*0.65, H*0.52, 1, true, false);
    ctx.save();
    ctx.globalAlpha = alpha*0.6;
    ctx.fillStyle = PAL.gold;
    ctx.font = 'bold 100px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('inf', W*0.3, H*0.42);
    ctx.restore();
    drawCaption(TXT[1], H*0.88, alpha);

  } else if (idx === 2) {
    for (var x2=0;x2<W;x2+=PX*8) drawPx(x2, H*0.65, PX*2, H*0.35, PAL.grayDk);
    drawPx(0, H*0.65, W, PX*2, PAL.gray);
    drawGojo(W*0.78, H*0.5, 1.5, true, false);
    var halvings = [0.5,0.25,0.125,0.0625];
    var halvLabels = ['1/2','1/4','1/8','1/16'];
    halvings.forEach(function(v, i) {
      var showP = clamp((prog - i*0.2)/0.3, 0, 1);
      var markerX = W*0.78 - v*W*0.6;
      ctx.globalAlpha = alpha*showP;
      for (var y2=H*0.3;y2<H*0.65;y2+=PX*4) drawPx(markerX, y2, PX*2, PX*2, PAL.teal);
      ctx.save();
      ctx.fillStyle = PAL.gold;
      ctx.font = 'bold '+(Math.max(20,32-i*4))+'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(halvLabels[i], markerX, H*0.28);
      ctx.restore();
      ctx.globalAlpha=1;
    });
    var arrowX = lerp(W*0.1, W*0.65, Math.min(prog*1.3,1));
    ctx.globalAlpha=alpha;
    drawPx(arrowX-8, H*0.52, 40, PX*3, PAL.blue);
    for (var ai=0;ai<16;ai+=PX) drawPx(arrowX+32, H*0.52+ai-16, PX*4, PX, PAL.blue);
    ctx.globalAlpha=1;
    drawCaption(TXT[2], H*0.88, alpha);

  } else if (idx === 3) {
    drawStars(mkRng(66), 60, 0.5);
    var barW3 = W*0.7;
    var barH3 = PX*10;
    var bx3 = (W-barW3)/2;
    var by3 = H*0.45;
    drawPx(bx3, by3, barW3, barH3, PAL.grayDk);
    var segs = [0.5,0.25,0.125,0.0625,0.03125,0.015625];
    var cumX = bx3;
    var segColors3 = [PAL.blue,PAL.purple,PAL.purpleLt,PAL.blueLt,PAL.teal,PAL.gray];
    segs.forEach(function(v,i) {
      var showP = clamp((prog-i*0.1)/0.3, 0, 1);
      var segW = v*barW3*showP;
      drawPx(cumX, by3, segW, barH3, segColors3[i]);
      if (showP>0.1) {
        ctx.globalAlpha=alpha;
        ctx.save();
        ctx.fillStyle=PAL.white;
        ctx.font='bold 20px monospace';
        ctx.textAlign='center';
        ctx.fillText('1/'+(Math.pow(2,i+1)), cumX+segW/2, by3-14);
        ctx.restore();
        ctx.globalAlpha=1;
      }
      cumX += v*barW3;
    });
    ctx.globalAlpha=alpha*Math.min(prog*4,1);
    for (var y3=by3-24;y3<by3+barH3+24;y3+=PX) drawPx(bx3+barW3, y3, PX*2, PX, PAL.gold);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 56px monospace';
    ctx.textAlign='center';
    ctx.fillText('= 1', W*0.5, by3-50);
    ctx.restore();
    ctx.globalAlpha=1;
    drawGojo(W/2, H*0.68, 1.4, true, false);
    for (var y4=H*0.35;y4<H*0.72;y4+=PX*3) {
      ctx.globalAlpha=alpha*(0.2+Math.sin(t*8+y4*0.05)*0.1);
      drawPx(W/2-20, y4, 40, PX*2, PAL.blueLt);
    }
    ctx.globalAlpha=1;
    drawCaption(TXT[3], H*0.88, alpha);

  } else if (idx === 4) {
    drawStars(mkRng(77), 60, 0.4);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 70px monospace';
    ctx.textAlign = 'center';
    if (prog > 0.1) { ctx.fillStyle=PAL.gold; ctx.fillText('1/2', W/2-320, H*0.38); }
    if (prog > 0.25) { ctx.fillStyle=PAL.white; ctx.fillText('+', W/2-230, H*0.38); }
    if (prog > 0.35) { ctx.fillStyle=PAL.blue; ctx.fillText('1/4', W/2-150, H*0.38); }
    if (prog > 0.5) { ctx.fillStyle=PAL.white; ctx.fillText('+', W/2-55, H*0.38); }
    if (prog > 0.6) { ctx.fillStyle=PAL.purple; ctx.fillText('1/8', W/2+30, H*0.38); }
    if (prog > 0.72) { ctx.fillStyle=PAL.white; ctx.fillText('+...', W/2+170, H*0.38); }
    if (prog > 0.82) { ctx.fillStyle=PAL.gold; ctx.font='bold 90px monospace'; ctx.fillText('= 1', W/2, H*0.52); }
    ctx.restore();
    ctx.globalAlpha=1;
    for (var di=0;di<12;di++) {
      var dotX = W*0.75 - Math.pow(0.6,di)*W*0.55;
      var showPd = clamp((prog-di*0.07)/0.2,0,1);
      ctx.globalAlpha=alpha*showPd;
      pixCircle(dotX, H*0.65, (12-di)*2, PAL.teal, true);
    }
    ctx.globalAlpha=1;
    for (var wy=H*0.58;wy<H*0.72;wy+=PX*2) {
      ctx.globalAlpha=alpha*(0.4+Math.sin(t*6+wy*0.1)*0.2);
      drawPx(W*0.75, wy, PX*3, PX*2, PAL.blueLt);
    }
    ctx.globalAlpha=1;
    drawGojo(W*0.78, H*0.65, 1.2, true, false);
    drawCaption(TXT[4], H*0.88, alpha);

  } else if (idx === 5) {
    drawStars(mkRng(88), 50, 0.3);
    ctx.globalAlpha=alpha;
    drawAxis(W/2, H*0.6, 700, PAL.gray);
    drawSeriesBars(W/2, H*0.6, prog);
    ctx.save();
    ctx.globalAlpha=alpha*Math.min(prog*3,1);
    ctx.fillStyle=PAL.purple;
    ctx.font='bold 48px monospace';
    ctx.textAlign='center';
    ctx.fillText('CONVERGENT', W/2, H*0.72);
    ctx.fillStyle=PAL.gold;
    ctx.font='bold 40px monospace';
    ctx.fillText('INFINITE SERIES', W/2, H*0.78);
    ctx.restore();
    ctx.globalAlpha=1;
    drawGojo(W*0.82, H*0.22, 1, true, false);
    drawCaption(TXT[5], H*0.88, alpha);

  } else if (idx === 6) {
    drawStars(mkRng(99), 80, 0.5);
    for (var ri=0;ri<6;ri++) {
      var rr6 = 80 + ri*55;
      var ringA6 = alpha*(0.6-ri*0.08)*(0.5+Math.sin(t*3+ri)*0.3);
      ctx.globalAlpha=ringA6;
      pixCircle(W/2, H*0.45, rr6, ri%2===0?PAL.blue:PAL.purple, false);
    }
    ctx.globalAlpha=1;
    drawGojo(W/2, H*0.45, 1.8, true, false);
    var objRng = mkRng(55);
    for (var oi=0;oi<8;oi++) {
      var angle6 = (oi/8)*Math.PI*2;
      var startDist6 = 500;
      var rawDist6 = startDist6*(1 - clamp(prog,0,0.95));
      var slowed6 = rawDist6*rawDist6/startDist6 + 80;
      var ox6 = W/2 + Math.cos(angle6)*slowed6;
      var oy6 = H*0.45 + Math.sin(angle6)*slowed6*0.6;
      ctx.globalAlpha=alpha;
      drawPx(ox6-8, oy6-8, 16, 16, objRng()>0.5?PAL.red:PAL.gold);
      for (var j6=1;j6<4;j6++) {
        var trailD6 = slowed6+j6*20;
        ctx.globalAlpha=alpha*(0.4-j6*0.1);
        drawPx(W/2+Math.cos(angle6)*trailD6-4, H*0.45+Math.sin(angle6)*trailD6*0.6-4, 8, 8, PAL.gray);
      }
      ctx.globalAlpha=1;
    }
    drawCaption(TXT[6], H*0.88, alpha);

  } else if (idx === 7) {
    drawStars(mkRng(11), 70, 0.4);
    ctx.globalAlpha=alpha*0.3; pixCircle(W/2, H*0.4, 350, PAL.blue, true);
    ctx.globalAlpha=alpha*0.15; pixCircle(W/2, H*0.4, 420, PAL.blueLt, true);
    ctx.globalAlpha=1;
    drawConvergence(W/2, H*0.4, 24, prog, PAL.blue);
    pixCircle(W/2, H*0.4, 60*(0.5+prog*0.5), PAL.blue, true);
    pixCircle(W/2, H*0.4, 40*(0.5+prog*0.5), PAL.blueLt, true);
    pixCircle(W/2, H*0.4, 16, PAL.white, true);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.blueLt; ctx.font='bold 100px monospace'; ctx.textAlign='center';
    ctx.fillText('BLUE', W/2, H*0.72);
    ctx.fillStyle=PAL.white; ctx.font='bold 48px monospace';
    ctx.fillText('CONVERGENCE', W/2, H*0.80);
    ctx.restore(); ctx.globalAlpha=1;
    drawGojo(W*0.78, H*0.25, 1, true, false);
    drawCaption(TXT[7], H*0.88, alpha);

  } else if (idx === 8) {
    drawStars(mkRng(22), 70, 0.4);
    ctx.globalAlpha=alpha*0.3; pixCircle(W/2, H*0.4, 350, PAL.red, true);
    ctx.globalAlpha=alpha*0.15; pixCircle(W/2, H*0.4, 420, PAL.redLt, true);
    ctx.globalAlpha=1;
    drawDivergence(W/2, H*0.4, 24, prog, PAL.red);
    pixCircle(W/2, H*0.4, 60*(0.5+prog*0.5), PAL.red, true);
    pixCircle(W/2, H*0.4, 40*(0.5+prog*0.5), PAL.redLt, true);
    pixCircle(W/2, H*0.4, 16, PAL.white, true);
    for (var sw=0;sw<4;sw++) {
      var rrsw = 80 + sw*60 + prog*180;
      if (rrsw < 480) { ctx.globalAlpha=alpha*(1-rrsw/480)*0.5; pixCircle(W/2, H*0.4, rrsw, PAL.redLt, false); }
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.redLt; ctx.font='bold 100px monospace'; ctx.textAlign='center';
    ctx.fillText('RED', W/2, H*0.72);
    ctx.fillStyle=PAL.white; ctx.font='bold 48px monospace';
    ctx.fillText('DIVERGENCE', W/2, H*0.80);
    ctx.restore(); ctx.globalAlpha=1;
    drawGojo(W*0.78, H*0.25, 1, true, false);
    drawCaption(TXT[8], H*0.88, alpha);

  } else if (idx === 9) {
    drawStars(mkRng(33), 60, 0.4);
    for (var yd=0;yd<H*0.75;yd+=PX*2) drawPx(W/2-PX, yd, PX*2, PX*2, PAL.gray);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.teal; ctx.font='bold 44px monospace'; ctx.textAlign='center';
    ctx.fillText('REAL MATH', W*0.25, H*0.18);
    ctx.fillStyle=PAL.white; ctx.font='bold 30px monospace';
    ctx.fillText('convergence', W*0.25, H*0.26);
    ctx.fillText('divergence', W*0.25, H*0.32);
    ctx.fillStyle=PAL.gray; ctx.font='bold 26px monospace';
    ctx.fillText('concepts in', W*0.25, H*0.40);
    ctx.fillText('calculus/series', W*0.25, H*0.46);
    ctx.fillStyle=PAL.purple; ctx.font='bold 44px monospace';
    ctx.fillText('FICTION', W*0.75, H*0.18);
    ctx.fillStyle=PAL.white; ctx.font='bold 30px monospace';
    ctx.fillText('attraction force', W*0.75, H*0.26);
    ctx.fillText('repulsion force', W*0.75, H*0.32);
    ctx.fillStyle=PAL.gold; ctx.font='bold 80px monospace';
    ctx.fillText('SUM', W*0.25, H*0.62);
    ctx.restore(); ctx.globalAlpha=1;
    drawGojo(W*0.75, H*0.52, 1.4, true, false);
    drawCaption(TXT[9], H*0.88, alpha);

  } else if (idx === 10) {
    drawStars(mkRng(44), 60, 0.5);
    var collideT = clamp(prog, 0, 1);
    var blueX = W*0.5 - (1-collideT)*W*0.3;
    var redX = W*0.5 + (1-collideT)*W*0.3;
    ctx.globalAlpha=alpha*0.5; pixCircle(blueX, H*0.42, 100, PAL.blue, true);
    ctx.globalAlpha=1; pixCircle(blueX, H*0.42, 80, PAL.blue, false);
    pixCircle(blueX, H*0.42, 40, PAL.blueLt, true);
    ctx.globalAlpha=alpha*0.5; pixCircle(redX, H*0.42, 100, PAL.red, true);
    ctx.globalAlpha=1; pixCircle(redX, H*0.42, 80, PAL.red, false);
    pixCircle(redX, H*0.42, 40, PAL.redLt, true);
    if (collideT > 0.7) {
      var flashA = (collideT-0.7)/0.3;
      ctx.globalAlpha=alpha*flashA*0.8;
      pixCircle(W/2, H*0.42, 150*flashA, PAL.purpleLt, true);
      ctx.globalAlpha=1;
    }
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.blueLt; ctx.font='bold 56px monospace'; ctx.textAlign='center';
    ctx.fillText('BLUE', blueX, H*0.62);
    ctx.fillStyle=PAL.redLt; ctx.fillText('RED', redX, H*0.62);
    ctx.fillStyle=PAL.white; ctx.font='bold 40px monospace';
    ctx.fillText('+', W/2, H*0.62);
    ctx.restore(); ctx.globalAlpha=1;
    drawCaption(TXT[10], H*0.88, alpha);

  } else if (idx === 11) {
    drawStars(mkRng(55), 80, 0.6);
    for (var ring=0;ring<8;ring++) {
      var rring = 60+ring*50 + Math.sin(t*2+ring)*20;
      var ringA11 = alpha*(0.8-ring*0.08)*(0.6+Math.sin(t*3+ring*0.7)*0.3);
      ctx.globalAlpha=ringA11;
      for (var ar=0;ar<32;ar++) {
        var angr = (ar/32)*Math.PI*2 + t*(ring%2===0?1:-1)*0.5;
        var prx = W/2+Math.cos(angr)*rring;
        var pry = H*0.42+Math.sin(angr)*rring;
        drawPx(prx-PX,pry-PX,PX*3,PX*3,ring%3===0?PAL.purple:ring%3===1?PAL.blue:PAL.purpleLt);
      }
    }
    ctx.globalAlpha=1;
    pixCircle(W/2, H*0.42, 50, PAL.purpleLt, true);
    pixCircle(W/2, H*0.42, 24, PAL.white, true);
    drawGojoSilhouette(W/2, H*0.72, 1.6, PAL.purpleDk, PAL.purple);
    drawGojo(W/2, H*0.72, 1.4, false, true);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.purpleLt; ctx.font='bold 80px monospace'; ctx.textAlign='center';
    ctx.fillText('HOLLOW', W/2, H*0.17);
    ctx.fillStyle=PAL.white; ctx.fillText('PURPLE', W/2, H*0.24);
    ctx.restore(); ctx.globalAlpha=1;
    drawCaption(TXT[11], H*0.88, alpha);

  } else if (idx === 12) {
    drawStars(mkRng(66), 60, 0.4);
    ctx.globalAlpha=alpha;
    drawAxis(W/2, H*0.45, 700, PAL.grayDk);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.gray; ctx.font='bold 32px monospace'; ctx.textAlign='center';
    ctx.fillText('Real', W/2+340, H*0.45+30);
    ctx.fillText('Imaginary', W/2-20, H*0.45-340);
    var iProg = ease(lt-0.5, 0.6);
    pixCircle(W/2, H*0.45-200*iProg, 20, PAL.purple, true);
    ctx.fillStyle=PAL.purpleLt; ctx.font='bold 56px monospace';
    if (prog>0.2) ctx.fillText('i = sqrt(-1)', W/2, H*0.45-220*iProg-20);
    if (prog>0.5) { ctx.fillStyle=PAL.gold; ctx.font='bold 48px monospace'; ctx.fillText('i^2 = -1', W/2, H*0.75); }
    ctx.restore(); ctx.globalAlpha=1;
    var spiralLim = clamp(prog,0,1)*180;
    for (var sa=0;sa<spiralLim;sa++) {
      var sang = (sa/60)*Math.PI*2;
      var sr2 = sa*1.8;
      var spx = W/2+Math.cos(sang)*sr2;
      var spy = H*0.45-Math.sin(sang)*sr2;
      ctx.globalAlpha=alpha*(sa/180)*0.8;
      drawPx(spx-PX,spy-PX,PX*2,PX*2,sa%3===0?PAL.purple:sa%3===1?PAL.blue:PAL.purpleLt);
    }
    ctx.globalAlpha=1;
    drawCaption(TXT[12], H*0.88, alpha);

  } else if (idx === 13) {
    drawStars(mkRng(77), 40, 0.3);
    drawPx(40, 80, W-80, PX*3, PAL.gray);
    drawPx(40, 80, PX*3, H*0.7-80, PAL.gray);
    drawPx(40, H*0.7, W-80, PX*3, PAL.gray);
    drawPx(W-43, 80, PX*3, H*0.7-80, PAL.gray);
    drawGojo(W*0.65, H*0.42, 1.5, false, false);
    pixCircle(W*0.3, H*0.28, 24, PAL.white, false);
    pixLine(W*0.3, H*0.28+24, W*0.3, H*0.28+100, PAL.white, 1);
    pixLine(W*0.3, H*0.28+50, W*0.22, H*0.28+80, PAL.white, 1);
    pixLine(W*0.3, H*0.28+50, W*0.38, H*0.28+80, PAL.white, 1);
    pixLine(W*0.3, H*0.28+100, W*0.22, H*0.28+160, PAL.white, 1);
    pixLine(W*0.3, H*0.28+100, W*0.38, H*0.28+160, PAL.white, 1);
    ctx.save();
    ctx.globalAlpha=alpha*Math.min(prog*3,1);
    ctx.fillStyle=PAL.teal; ctx.font='bold 36px monospace'; ctx.textAlign='center';
    ctx.fillText('RIKEN', W*0.3, H*0.58);
    ctx.fillStyle=PAL.gold; ctx.font='bold 28px monospace';
    ctx.fillText('Japan Science Institute', W/2, H*0.65);
    ctx.fillStyle=PAL.purple; ctx.font='bold 32px monospace';
    ctx.fillText('x JJK Collaboration', W/2, H*0.70);
    ctx.restore(); ctx.globalAlpha=1;
    var mathSyms = ['SUM','INF','i','√','pi','∂'];
    mathSyms.forEach(function(sym, si) {
      var ssx = 100+si*(W-200)/5;
      var ssy = H*0.1 + Math.sin(t*2+si)*20;
      ctx.globalAlpha=alpha*(0.4+Math.sin(t+si*0.9)*0.3);
      ctx.save();
      ctx.fillStyle=[PAL.gold,PAL.purple,PAL.blue,PAL.teal,PAL.gold,PAL.purple][si];
      ctx.font='bold 48px monospace'; ctx.textAlign='center';
      ctx.fillText(sym, ssx, ssy);
      ctx.restore(); ctx.globalAlpha=1;
    });
    drawCaption(TXT[13], H*0.88, alpha);

  } else if (idx === 14) {
    drawStars(mkRng(88), 70, 0.5);
    drawGojoSilhouette(W/2, H*0.5, 2.0, PAL.purpleDk, PAL.blue);
    drawGojo(W/2, H*0.5, 2.2, false, true);
    for (var ei=0;ei<16;ei++) {
      var eang = (ei/16)*Math.PI*2;
      var elen = 80 + Math.sin(t*4+ei)*30;
      var eex = W/2 + Math.cos(eang)*elen*prog;
      var eey = H*0.5 + Math.sin(eang)*elen*prog*0.6;
      ctx.globalAlpha=alpha*(0.5+Math.sin(t*3+ei)*0.3)*prog;
      drawPx(eex-PX,eey-PX,PX*2,PX*2,ei%2===0?PAL.blueLt:PAL.teal);
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.teal; ctx.font='bold 70px monospace'; ctx.textAlign='center';
    ctx.fillText('SIX EYES', W/2, H*0.17);
    ctx.fillStyle=PAL.white; ctx.font='bold 36px monospace';
    ctx.fillText('Perfect precision', W/2, H*0.24);
    ctx.fillText('over cursed energy', W/2, H*0.29);
    ctx.restore(); ctx.globalAlpha=1;
    drawCaption(TXT[14], H*0.88, alpha);

  } else if (idx === 15) {
    drawStars(mkRng(99), 100, 0.7);
    for (var fr=0;fr<12;fr++) {
      var frr = 40+fr*80 + prog*200;
      var fra = alpha*(1-frr/(W*0.9))*(0.7+Math.sin(t*4+fr)*0.3);
      if (fra>0 && frr < W) { ctx.globalAlpha=fra; pixCircle(W/2, H*0.42, frr, fr%3===0?PAL.purple:fr%3===1?PAL.blue:PAL.purpleLt, false); }
    }
    ctx.globalAlpha=1;
    drawGojoSilhouette(W/2, H*0.68, 2.2, PAL.purpleDk, PAL.purple);
    drawGojo(W/2, H*0.68, 2.0, false, true);
    var pRng = mkRng(77);
    for (var pi=0;pi<60;pi++) {
      var pang = pRng()*Math.PI*2;
      var pr2 = prog*600*pRng();
      var pex = W/2+Math.cos(pang)*pr2;
      var pey = H*0.42+Math.sin(pang)*pr2*0.6;
      if (pex>0&&pex<W&&pey>0&&pey<H) {
        ctx.globalAlpha=alpha*(1-pr2/600)*0.9;
        drawPx(pex-PX,pey-PX,PX*(1+Math.floor(pRng()*3)),PX*(1+Math.floor(pRng()*3)),
               pRng()>0.5?PAL.purple:pRng()>0.5?PAL.blue:PAL.purpleLt);
      }
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.purpleLt; ctx.font='bold 88px monospace'; ctx.textAlign='center';
    ctx.fillText('HOLLOW', W/2, H*0.17);
    ctx.fillStyle=PAL.white; ctx.fillText('PURPLE', W/2, H*0.25);
    ctx.fillStyle=PAL.gold; ctx.font='bold 40px monospace';
    ctx.fillText('Math made technique.', W/2, H*0.33);
    ctx.restore(); ctx.globalAlpha=1;
    drawCaption(TXT[15], H*0.88, alpha);
  }

  drawVignette(0.5);
  drawScanlines(0.03);
};

window.__ready = true;
</script>
</body>
</html>
