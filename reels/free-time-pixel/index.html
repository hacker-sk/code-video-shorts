"This morning, an alarm screamed until you woke up.",
"You silenced it, and just like that, your day was already decided. Where you had to be, what you had to finish, and how many hours belonged to someone else.",
"And tonight, you'll set that same alarm to scream again.",
"Now, rewind 50,000 years.",
"A man wakes up with the sunlight. No alarm. No schedule. No boss waiting for him.",
"He owns a spear, two animal hides, and a fire.",
"And the first question he asks himself is something you rarely get to ask:",
"\"What should I do today?\"",
"You probably think his life was miserable. That every waking hour was spent desperately searching for food.",
"But archaeological evidence tells a very different story.",
"When researchers compared the remains of ancient hunter-gatherers with those of early farmers, they found something unexpected.",
"The hunter-gatherers often had stronger bones, healthier teeth, and fewer signs of repetitive physical strain.",
"The early farmers, despite having crops, storage, and permanent homes, frequently showed more cavities, joint damage, and signs of poorer nutrition.",
"The people who supposedly represented progress were sometimes living harder lives.",
"But what did their days actually look like?",
"Let's find out.",
"You wake up around sunrise. The fire is still burning, and people are already eating leftover meat and nuts.",
"You discuss where the water is, which plants are ready to gather, and where animal tracks were spotted.",
"Today, nobody needs to hunt. The last hunt provided enough food for several days.",
"So, some people go gathering, while you sharpen your spear and work on a piece of animal hide.",
"Not because someone ordered you to. Because you enjoy being good at something.",
"And by the afternoon, most essential work is finished.",
"Of course, sometimes food runs low.",
"Then you hunt.",
"You don't chase an animal like in the movies. You follow it at a steady pace, allowing your body to cool itself while the animal gradually overheats and becomes exhausted.",
"It can take hours, but one successful hunt can feed everyone for days.",
"And the next day, you might not need to hunt at all.",
"This wasn't just a fantasy about the past.",
"In the 1960s, anthropologist Richard Lee studied the Ju'hoansi people of the Kalahari Desert.",
"He expected them to spend almost every daylight hour finding food.",
"So he followed them, recorded their activities, and actually counted their working hours.",
"His findings surprised him.",
"They spent roughly 17 hours a week obtaining food.",
"Not every day. The entire week.",
"That's around two and a half days of food-gathering work.",
"Other studies of hunter-gatherer communities found similarly modest food-acquisition workloads, although the numbers varied between groups and seasons.",
"But here's what makes this even more interesting.",
"Their free time wasn't wasted.",
"People sat together, talked, joked, played with children, and made things.",
"At Blombos Cave in South Africa, archaeologists discovered carefully drilled shell beads more than 70,000 years old.",
"And in Germany, researchers found a flute carved from a vulture's wing bone, around 40,000 years old.",
"Think about that.",
"Someone had enough time to travel, collect seashells, make jewellery, and create music.",
"Beauty wasn't something they postponed until retirement.",
"It was part of an ordinary day.",
"And those long hours together served another purpose.",
"In a world without hospitals, insurance, or retirement savings, your greatest protection was other people.",
"When you were sick, injured, or unable to find food, your community could keep you alive.",
"Your relationships were your safety net.",
"Then came the night.",
"Around the fire, conversations changed. People told stories about ancestors, spirits, impossible adventures, and how the world began.",
"Anthropologist Polly Wiessner found that, among the Ju'hoansi she studied, nighttime conversations were far more focused on storytelling than daytime conversations.",
"The fire wasn't just keeping people warm.",
"It was creating space for imagination, shared memories, and culture.",
"But around 10,000 years ago, something began to change.",
"Humans started farming.",
"At first, it looked like a brilliant deal.",
"Plant seeds, grow more food, and stop depending on unpredictable hunts.",
"But more food allowed populations to grow.",
"More people needed more food.",
"So, they planted more fields.",
"And more fields required more work: planting, watering, weeding, harvesting, storing, and protecting crops.",
"Eventually, communities became too large to return to their old way of life.",
"Farming created permanent settlements, specialisation, cities, and eventually systems of taxes and wage labour.",
"Little by little, human life became organised around work.",
"Nobody stole your time in one dramatic moment.",
"It was exchanged, generation after generation, for a different kind of security.",

"You spend years working, hoping that one day you'll finally have enough money and freedom to enjoy your life.",

"Of course, their lives had dangers we can barely imagine. Disease, injury, hunger, and unpredictable seasons were real threats.",
