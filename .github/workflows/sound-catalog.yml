name: Sound Catalog

# Rebuilds sounds/CATALOG.md and sounds/index/*.txt whenever the sound library changes,
# so the chat can find sounds by name without reading 3000 files.
# Zips in sounds/ (e.g. sounds/sfx.zip, sounds/bgm.zip) are unpacked first (into sounds/sfx/, sounds/bgm/).
on:
  push:
    branches: [main]
    paths:
      - 'sounds/**'
      - '!sounds/index/**'
      - '!sounds/CATALOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Unpack sound zips
        run: |
          shopt -s nullglob
          for z in sounds/*.zip; do
            d="${z%.zip}"
            [ -d "$d" ] || unzip -q "$z" -d "$d"
          done

      - name: Build catalog
        run: node skills/code-video/scripts/catalog.mjs sounds

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/index sounds/CATALOG.md
          git diff --cached --quiet || { git commit -m "Update sound catalog" && git push; }
