name: Sound Catalog

# Rebuilds sounds/CATALOG.md and sounds/index/*.txt whenever the sound library changes,
# so the chat can find sounds by name without reading 3000 files.
# The library can be folders in sounds/, zips in sounds/, or zips attached to the GitHub Release tagged "sounds"
# (for files over 100 MB). Zips are unpacked first (sounds/sfx.zip -> sounds/sfx/).
# After attaching zips to an existing release, run this workflow by hand (Actions > Sound Catalog > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'sounds/**'
      - '!sounds/index/**'
      - '!sounds/CATALOG.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Fetch and unpack sound library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          if gh release view sounds >/dev/null 2>&1; then
            gh release download sounds --pattern '*.zip' --dir sounds --clobber
          fi
          for z in sounds/*.zip; do
            d="${z%.zip}"
            [ -d "$d" ] || unzip -q "$z" -d "$d"
          done

      - name: Build catalog
        run: node skills/code-video/scripts/catalog.mjs sounds

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/index sounds/CATALOG.md
          git diff --cached --quiet || { git commit -m "Update sound catalog" && git push; }
