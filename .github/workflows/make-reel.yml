name: Make Reel

# Every reel is rendered and published by its OWN job, one after the other (never all in one job):
# 1) Push (chat commits reels/<n>/index.html [+ video.json, audio.json, music.wav|mp3]) -> every reel changed in the push
#    (all commits of the push, not only the last one) becomes its own job in the queue, one at a time (max-parallel 1).
#    A failed reel does not stop the next ones. Committing each reel as its own commit gives each reel its own run.
# 2) Manual run with `name` (+ optional inline `html` payload) -> renders that one reel.
# If no reel changed in a run, nothing is rendered (the run still passes).
#
# Voice-over: if the repo secret GEMINI_API_KEY is set, each reel's caption lines (TXT in index.html)
# are spoken with Gemini TTS and the video timing follows the voice. Without the secret, nothing changes.
# Extra keys: add secrets GEMINI_API_KEY_2 and GEMINI_API_KEY_3 (up to _5 is read); when one key hits its limit
# the next one is used. Keys from the same Google Cloud project share one quota, so use keys from different projects.
# Optional repo variables: GEMINI_VOICE (default Puck), GEMINI_TTS_MODEL (default gemini-3.8-flash-tts, the same model as the
# Hindi Shorts pipeline; gemini-2.5-flash-preview-tts is used automatically as the fallback).
#
# Sound: reels/<n>/audio.json can add background music and sound effects from the sounds/ library
# (see skills/code-video/SKILL.md). The library comes from sounds/ in the repo and from any .zip attached
# to the GitHub Release tagged "sounds" (use that for files over 100 MB); zips are unpacked before rendering.
#
# Publishing (skills/code-video/scripts/publish.mjs) depends on the video:
#   REEL (vertical and at most 3 minutes): YouTube Shorts + Instagram Reels, both through Buffer, scheduled 1 minute later
#     (needs the secret BUFFER_API_KEY; the video is put on a temporary public host first: Uguu, Cloudinary if CLOUDINARY_URL is set).
#   LONG (landscape, or longer than 3 minutes): YouTube through the YouTube Data API v3 ONLY (secrets YT_CLIENT_ID, YT_CLIENT_SECRET,
#     YT_REFRESH_TOKEN), never through Buffer; Instagram still through Buffer as before.
# Optional repo variables: BUFFER_CHANNEL_ID (YouTube), BUFFER_INSTAGRAM_CHANNEL_ID, BUFFER_INSTAGRAM (set to off to skip Instagram),
# BUFFER_YOUTUBE_PRIVACY (public|unlisted|private), YT_PRIVACY (privacy of API uploads, default = BUFFER_YOUTUBE_PRIVACY), BUFFER_YOUTUBE_CATEGORY.
#
# Caches (so later jobs are faster): FFmpeg (static binary), the unpacked sound library (re-downloaded only when the release zips change),
# the Playwright browser + npm downloads, and the generated voice-over clips (a line that didn't change is not re-generated).
# The voice-over clips are saved even when the job fails, so a retry continues where it stopped.
on:
  push:
    paths:
      - 'reels/*/index.html'
      - 'reels/*/video.json'
      - 'reels/*/audio.json'
  workflow_dispatch:
    inputs:
      name:
        description: 'Reel folder name under reels/ (letters, numbers, - _)'
        required: true
      html:
        description: 'Optional: full index.html payload (overwrites reels/<n>/index.html)'
        required: false
      width:
        description: 'Width (used only if video.json is missing)'
        default: '1080'
      height:
        description: 'Height (used only if video.json is missing)'
        default: '1920'
      fps:
        description: 'FPS (used only if video.json is missing)'
        default: '30'
      duration:
        description: 'Seconds (used only if video.json is missing)'
        default: '10'

permissions:
  contents: read

jobs:
  # works out which reels changed in this push (every commit of the push) and hands them to the render jobs as a list
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reels: ${{ steps.list.outputs.reels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List the reels to render
        id: list
        env:
          EVENT: ${{ github.event_name }}
          NAME: ${{ inputs.name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT" = "workflow_dispatch" ]; then
            LIST="$NAME"
          else
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD^"
            fi
            LIST=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'reels/*/index.html' 'reels/*/video.json' 'reels/*/audio.json' | cut -d/ -f2 | sort -u)
          fi
          for n in $LIST; do
            [[ "$n" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Bad reel name: $n"; exit 1; }
          done
          if [ -z "$LIST" ]; then
            echo "No reel changed in this run: nothing to render."
            JSON='[]'
          else
            JSON=$(printf '%s\n' $LIST | jq -R . | jq -sc .)
          fi
          echo "Reels to render, one job each: $JSON"
          echo "reels=$JSON" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: ${{ needs.plan.outputs.reels != '[]' }}
    name: Render ${{ matrix.reel }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1      # one reel at a time, in order
      fail-fast: false     # a failed reel never stops the ones after it
      matrix:
        reel: ${{ fromJson(needs.plan.outputs.reels) }}
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare reel folder
        env:
          EVENT: ${{ github.event_name }}
          NAME: ${{ matrix.reel }}
          HTML: ${{ inputs.html }}
          W: ${{ inputs.width }}
          H: ${{ inputs.height }}
          FPS: ${{ inputs.fps }}
          DUR: ${{ inputs.duration }}
        run: |
          set -e
          n="$NAME"
          [[ "$n" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Bad reel name: $n"; exit 1; }
          mkdir -p "reels/$n"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$HTML" ]; then
            printf '%s' "$HTML" > "reels/$n/index.html"
          fi
          [ -f "reels/$n/index.html" ] || { echo "reels/$n/index.html missing"; exit 1; }
          if [ ! -f "reels/$n/video.json" ]; then
            echo "{\"width\":${W:-1080},\"height\":${H:-1920},\"fps\":${FPS:-30},\"duration\":${DUR:-10}}" > "reels/$n/video.json"
          fi

      # ---- FFmpeg: static binary kept in the cache, so it is not installed again on every run ----
      # Bump the "v1" in the key to force a fresh download.
      - name: Restore FFmpeg cache
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-${{ runner.os }}-v1

      - name: Install FFmpeg (only when not cached)
        if: ${{ steps.ffcache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$HOME/ffmpeg-bin"
          if curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o "$RUNNER_TEMP/ff.tar.xz"; then
            tar -xJf "$RUNNER_TEMP/ff.tar.xz" -C "$HOME/ffmpeg-bin" --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe'
            rm -f "$RUNNER_TEMP/ff.tar.xz"
          else
            # download host down: fall back to apt and keep the binaries for the cache
            sudo apt-get install -y --no-install-recommends ffmpeg || { sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg; }
            cp "$(command -v ffmpeg)" "$(command -v ffprobe)" "$HOME/ffmpeg-bin/"
          fi

      - name: Add FFmpeg to PATH
        run: |
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-bin/ffmpeg" -version | head -1

      # ---- sound library: cached, re-downloaded only when the release zips change ----
      - name: Check sound library version
        id: snd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          K=none
          if gh release view sounds >/dev/null 2>&1; then
            K=$(gh release view sounds --json assets --jq '.assets[] | "\(.id) \(.name) \(.size)"' | sha256sum | cut -c1-16)
          fi
          echo "key=$K" >> "$GITHUB_OUTPUT"

      - name: Restore sound library cache
        id: sndcache
        uses: actions/cache/restore@v4
        with:
          path: .sound-cache
          key: sounds-${{ steps.snd.outputs.key }}

      - name: Fetch and unpack sound library
        env:
          GH_TOKEN: ${{ github.token }}
          HIT: ${{ steps.sndcache.outputs.cache-hit }}
          KEY: ${{ steps.snd.outputs.key }}
        run: |
          shopt -s nullglob
          mkdir -p .sound-cache
          if [ "$KEY" != "none" ] && [ "$HIT" != "true" ]; then
            # zips attached to the release tagged "sounds" (for files over 100 MB)
            mkdir -p "$RUNNER_TEMP/zips"
            gh release download sounds --pattern '*.zip' --dir "$RUNNER_TEMP/zips" --clobber
            for z in "$RUNNER_TEMP"/zips/*.zip; do
              unzip -q "$z" -d ".sound-cache/$(basename "$z" .zip)"
            done
            rm -rf "$RUNNER_TEMP/zips"
          fi
          cp -al .sound-cache/. sounds/ 2>/dev/null || cp -a .sound-cache/. sounds/
          # small zips committed straight into sounds/
          for z in sounds/*.zip; do
            d="${z%.zip}"
            [ -d "$d" ] || unzip -q "$z" -d "$d"
          done

      - name: Save sound library cache
        if: ${{ steps.snd.outputs.key != 'none' && steps.sndcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .sound-cache
          key: sounds-${{ steps.snd.outputs.key }}

      # ---- Playwright browser + npm downloads ----
      - name: Find latest Playwright version
        id: pwv
        run: echo "v=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: pw-${{ runner.os }}-${{ steps.pwv.outputs.v }}

      # ---- voice-over clips: a line that didn't change keeps its audio (faster, and the same voice every time) ----
      # Restored from the newest earlier job and saved again at the end of this job, even if the job failed,
      # so a retry after a rate-limit failure continues where it stopped.
      - name: Restore voice-over clips
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/cache/restore@v4
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.reel }}
          restore-keys: |
            tts-

      - name: Render reel
        env:
          LIST: ${{ matrix.reel }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          TTS_CACHE_DIR: ${{ github.workspace }}/.tts-cache
        run: |
          set -e
          S="$GITHUB_WORKSPACE/skills/code-video/scripts"
          PW=""
          for n in $LIST; do
            cd "$GITHUB_WORKSPACE/reels/$n"
            [ -f package.json ] || echo '{"name":"video","private":true}' > package.json
            npm i playwright
            if [ -z "$PW" ]; then
              npx playwright install --with-deps chromium   # system libraries once per job
              PW=1
            else
              npx playwright install chromium
            fi
            MUSIC=""
            for a in music.wav music.mp3; do if [ -f "$a" ]; then MUSIC="$a"; fi; done
            if [ -n "$GEMINI_API_KEY" ]; then
              # voice-over: writes voice.wav + timing.json (render.mjs picks timing.json up automatically)
              node "$S/tts.mjs" index.html voice.wav timing.json
            fi
            # voice + music + sound effects -> mix.wav (writes nothing when there is nothing to mix)
            node "$S/mix.mjs" mix.wav
            AUDIO=""
            if [ -f mix.wav ]; then
              AUDIO="--audio mix.wav"
            elif [ -n "$MUSIC" ]; then
              AUDIO="--audio $MUSIC"
            fi
            node "$S/render.mjs" index.html video.mp4 $AUDIO
          done

      - name: Save voice-over clips
        if: ${{ always() && env.GEMINI_API_KEY != '' && hashFiles('.tts-cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .tts-cache
          key: tts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.reel }}

      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ matrix.reel }}
          path: reels/${{ matrix.reel }}/video.mp4
          if-no-files-found: error

      - name: Publish (reels via Buffer, long/landscape YouTube via the YouTube API)
        if: ${{ env.BUFFER_API_KEY != '' || env.YT_REFRESH_TOKEN != '' }}
        env:
          LIST: ${{ matrix.reel }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_INSTAGRAM: ${{ vars.BUFFER_INSTAGRAM }}
          BUFFER_YOUTUBE_PRIVACY: ${{ vars.BUFFER_YOUTUBE_PRIVACY }}
          BUFFER_YOUTUBE_CATEGORY: ${{ vars.BUFFER_YOUTUBE_CATEGORY }}
        run: |
          set -e
          for n in $LIST; do
            node skills/code-video/scripts/publish.mjs "$n" "reels/$n/video.mp4"
          done
