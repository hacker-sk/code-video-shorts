name: Retry Failed Reel

# When a "Make Reel" run ends in failure, re-run only its failed jobs (the reels that failed; the ones that
# already finished are not rendered or posted again). At most 2 automatic re-runs per run (attempts 2 and 3),
# so a reel with a real bug in its code does not loop forever. The voice-over clips are cached, so a re-run
# after a Gemini rate limit continues where it stopped.
# A manual re-run from the Actions tab still works as before.
on:
  workflow_run:
    workflows: ["Make Reel"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "Run $RUN_ID failed on attempt $ATTEMPT: re-running its failed jobs in 60 s"
          sleep 60   # lets rate limits (Gemini per-minute quota) cool down
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
